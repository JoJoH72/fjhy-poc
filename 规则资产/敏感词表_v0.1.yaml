# ============================================================================
# 敏感词表 v0.1   —   TR-D3-01 / TR-D3-02 / TR-D5-10 的数据来源
# ----------------------------------------------------------------------------
# 为什么名单外置、不写死在代码里：
#   规则表第 3 条原文是「不能包含 KTV、SPA **等**娱乐活动，黄山、九寨沟**等**
#   旅游景点」。两个「等」字说明这张名单一定会继续长。写死在代码里，
#   每加一个词都要改代码、重新发版；放这里由规则管理员在「规则本体」栏目维护，
#   走发布管理的版本化流程。
#
# 【这张表最大的风险不是漏报，是误报】
#   全局纪律第 9 条：误报会把正常交付物判成问题件。本表最危险的三个词：
#     · 黄山   —— 酒店地址里有「黄山路」，福州/合肥/南京都有这条路
#     · SPA    —— 正常商务酒店名含「SPA」的不少，且与英文单词易混
#     · 洗浴   —— 「洗衣」「浴巾」「洗漱用品」都是正常住宿费明细项
#   所以每个词都必须带 must_not_hit，且这些反例全部落成单元测试。
#   **没有 must_not_hit 的词不许进这张表。**
#
# 【匹配前先归一】见 normalize 段。ＫＴＶ（全角）、ktv（小写）、K T V（带空格）
#   都要能命中，否则这条闸形同虚设；但归一本身不能把反例也归一成命中。
# ============================================================================

meta:
  version: "0.1"
  rules: [TR-D3-01, TR-D3-02, TR-D5-10]
  source_file: "差旅费审核规则.xlsx（29 条表）第 3、4 条"
  source_confidence: 原生文本
  maintainer: 规则管理员（领域知识资产 → 规则本体）
  control_type: 警告            # 三条规则的控制类型都是「警告」，不是「禁止」
  control_rationale: |
    **这三条只能是警告，不能是禁止。** 命中敏感词说明「可能」有问题，
    而最终判断需要看发票全貌和业务背景——一家名为「XX温泉度假酒店」的
    正常会议酒店会命中「温泉」。禁止级会把它直接挡死，审核岗连看一眼的
    机会都没有。警告级则是把单据推到人工眼前，由人决定。

# ----------------------------------------------------------------------------
# 匹配前的归一化（顺序即执行顺序）
# ----------------------------------------------------------------------------
normalize:
  - {step: 1, op: 全角转半角, scope: 字母与数字, note: "ＫＴＶ → KTV"}
  - {step: 2, op: 英文转大写, note: "ktv / Ktv → KTV"}
  - {step: 3, op: 删除空白, chars: [" ", "\t", "　"], note: "K T V → KTV。开票单位名里插空格是常见的规避手法。只作用于 match: substring 与 substring_with_exclusions。"}
  - step: "3b"
    op: 保留空白的副本
    applies_to: word_boundary_latin
    note: |
      **match: word_boundary_latin 的词必须在「保留空白」的文本上判边界。**
      实测踩到：先删空白，「XX SPA会馆」变成「XXSPA会馆」，SPA 左邻成了
      拉丁字母 X，边界规则反而把真命中挡掉了。所以归一要保留两份文本：
      substring 用删空白的那份，拉丁词边界用保留空白的那份。
      （YAML 自身的坑：块标量 | 不能写在 flow mapping {} 里面，所以这一项
      用块式映射写。本体文件里同样的错误犯过 5 次，见进度.md 的纪律第 9 条。）
  - {step: 4, op: 不做繁简转换, reason: "繁简转换会把「幹」变「干」，继而让「干部培训」命中含「干」的词。收益小、风险大，不做。"}
  - {step: 5, op: 不做拼音/同音归一, reason: "同音归一的误报面积极大（「洗浴」↔「西域」），这一层交给 AI 审核（TR-D9-04 软规则），不放进硬规则。"}

# ----------------------------------------------------------------------------
# 名单一：敏感开票单位（TR-D3-01，作用字段 C0504 发票.开票单位）
# ----------------------------------------------------------------------------
sensitive_issuer_keywords:

  # ── 娱乐场所类（规则表第 3 条明示 KTV、SPA）──────────────────────────────
  - term: KTV
    category: 娱乐场所
    match: substring
    source: {file: 规则清单, clause: 第3条, verbatim: true}
    must_hit: ["星光KTV", "XX量贩式ktv", "ＫＴＶ会所", "K T V 娱乐城"]
    must_not_hit: ["KT板材有限公司", "TVB", "KTC显示器"]
    note: "原文明示，verbatim=true。归一后三种写法都命中。"

  - term: SPA
    category: 娱乐场所
    match: word_boundary_latin        # 不是 substring：避免命中含 SPA 的英文词
    source: {file: 规则清单, clause: 第3条, verbatim: true}
    must_hit: ["XX SPA会馆", "ＳＰＡ休闲中心", "厦门SPA养生馆"]
    known_misses: ["XXspa养生"]
    must_not_hit: ["SPARK传媒", "SPACE空间设计", "ESPA酒店用品", "新亚太SPACE"]
    note: |
      **这是本表最需要小心的一个词。** 原文明示所以必须收，但 SPA 是三个拉丁
      字母，substring 匹配会打中 SPARK / SPACE / ESPA 这类正常公司名。
      改用拉丁词边界（前后不得紧邻拉丁字母），反例就全过了。
      代价：「XXspa养生」这种无分隔的写法会漏。宁可漏这一种，不可误伤三类。
  - term: 水疗
    category: 娱乐场所
    match: substring_with_exclusions
    exclusions: ["水疗设备", "康复水疗", "水疗科", "水疗机"]
    source: {file: 推断, basis: "SPA 的中文常见写法，属第 3 条「等」字外延"}
    confidence: 外延推断
    must_hit: ["XX水疗中心", "水疗会所"]
    must_not_hit: ["水疗设备制造有限公司", "康复水疗科", "XX水疗机销售部"]
    needs_confirm: true
    gap: G-33
    note: "**不是原文，是我按「等」字外延加的，标 needs_confirm。** 医疗康复类的「水疗」是正当医疗项目，反例里留了两条。"

  - term: 夜总会
    category: 娱乐场所
    match: substring
    source: {file: 推断, basis: 第3条「等娱乐活动」外延}
    confidence: 外延推断
    must_hit: ["XX夜总会"]
    must_not_hit: ["夜市管理服务中心", "总会计师事务所"]
    needs_confirm: true
    gap: G-33

  - term: 歌舞厅
    category: 娱乐场所
    match: substring
    source: {file: 推断, basis: 第3条「等娱乐活动」外延}
    confidence: 外延推断
    must_hit: ["XX歌舞厅"]
    must_not_hit: ["歌舞剧院", "文化馆歌舞团"]
    needs_confirm: true
    gap: G-33
    note: "反例里的「歌舞剧院」「歌舞团」是正常文化单位，若写成「歌舞」就会误伤，所以收完整词「歌舞厅」。"

  - term: 足浴
    category: 娱乐场所
    match: substring
    source: {file: 推断, basis: 第3条「等娱乐活动」外延}
    confidence: 外延推断
    must_hit: ["XX足浴馆"]
    must_not_hit: ["足球俱乐部", "浴室设备公司"]
    needs_confirm: true
    gap: G-33

  - term: 高尔夫
    category: 娱乐场所
    match: substring
    source: {file: 推断, basis: 第3条「等娱乐活动」外延}
    confidence: 外延推断
    must_hit: ["XX高尔夫俱乐部"]
    must_not_hit: ["高尔服装", "夫子庙文化"]
    needs_confirm: true
    gap: G-33

  # ── 旅游景点类（规则表第 3 条明示 黄山、九寨沟）──────────────────────────
  - term: 九寨沟
    category: 旅游景点
    match: substring
    source: {file: 规则清单, clause: 第3条, verbatim: true}
    must_hit: ["九寨沟XX旅行社", "九寨沟景区管理局"]
    must_not_hit: ["九寨商贸", "沟渠工程公司"]
    note: "三个字且无常见同形词，substring 安全。"

  - term: 黄山
    category: 旅游景点
    match: substring_with_exclusions
    exclusions: ["黄山路", "黄山大厦", "黄山街", "黄山北路", "黄山南路", "黄山东路", "黄山西路"]
    source: {file: 规则清单, clause: 第3条, verbatim: true}
    must_hit: ["黄山风景区管委会", "黄山XX旅游发展有限公司"]
    must_not_hit: ["福州黄山路XX酒店", "合肥黄山大厦", "黄山路街道办"]
    note: |
      **本表唯一需要排除项的词。** 「黄山路」是福州、合肥、南京、青岛都有的
      常见路名，酒店名里带路名极普遍。不加 exclusions，福州出差住在黄山路的
      单子会被判「旅游景点开票」——这正是全局纪律第 9 条说的那种误报。
      exclusions 优先于 term：先看是否命中排除项，命中则直接放过。

# ----------------------------------------------------------------------------
# 名单二：敏感消费项（TR-D3-02，作用字段 C0509 发票.发票明细）
# ----------------------------------------------------------------------------
sensitive_item_keywords:

  - term: 洗浴
    category: 消费内容
    match: substring
    source: {file: 规则清单, clause: 第4条, verbatim: true}
    must_hit: ["洗浴服务", "洗浴中心消费", "桑拿洗浴"]
    must_not_hit: ["洗衣服务", "浴巾", "浴室用品", "洗漱用品", "洗车费", "沐浴露"]
    note: |
      **规则表第 4 条只举了「洗浴」一个例子，但它恰好是最容易误伤的那种词。**
      住宿费发票明细里「洗衣服务」「浴巾」「洗漱用品」都是正常项。
      收完整词「洗浴」而不是单字「洗」或「浴」，六个反例就全过。
      这条在 TR-D3-02 的 note 里已点明「『洗浴』要命中，『洗衣』『浴巾』不许误伤」。

  - term: 按摩
    category: 消费内容
    match: substring_with_exclusions
    exclusions: ["按摩椅", "按摩器", "推拿理疗"]
    source: {file: 推断, basis: 第4条「等敏感词」外延}
    confidence: 外延推断
    must_hit: ["按摩服务"]
    must_not_hit: ["按摩椅采购", "推拿理疗（医保）"]
    needs_confirm: true
    gap: G-33
    note: "反例「按摩椅采购」是固定资产，不是消费；但本规则只作用在差旅费发票明细上，采购不会出现在这里，所以这条反例偏保守。"

  - term: 足疗
    category: 消费内容
    match: substring
    source: {file: 推断, basis: 第4条外延}
    confidence: 外延推断
    must_hit: ["足疗服务"]
    must_not_hit: ["足球", "治疗费"]
    needs_confirm: true
    gap: G-33

  - term: 景点门票
    aliases: ["景区门票"]
    category: 消费内容
    match: substring
    source: {file: 推断, basis: "与第 3 条旅游景点同源；TR-D9-04「严禁变相旅游」也靠这一类线索"}
    confidence: 外延推断
    must_hit: ["景点门票", "景区门票"]
    must_not_hit: ["会议门票", "展会入场券", "车票", "机票"]
    needs_confirm: true
    gap: G-33
    note: "**「门票」单字词绝对不能收**——「会议门票」「展会入场券」是正常的会议费。必须带「景点/景区」前缀。"

  - term: 烟酒
    category: 消费内容
    match: substring
    source: {file: 推断, basis: 第4条外延}
    confidence: 外延推断
    must_hit: ["烟酒礼品"]
    must_not_hit: ["酒店住宿费", "酒水（会议用）", "烟台XX公司", "酒泉宾馆"]
    needs_confirm: true
    gap: G-33
    note: |
      **「酒」单字绝对不能收**：「酒店住宿费」是差旅费最核心的正常项，
      收单字「酒」等于把所有住宿费判成不合规。反例里特意放了
      「烟台」「酒泉」两个地名——它们也是单字匹配会炸的地方。

# ----------------------------------------------------------------------------
# 名单三：不得列支项（TR-D5-10，作用字段 C0115 摘要 / C0127 资金用途）
# ----------------------------------------------------------------------------
excluded_purpose_keywords:
  - term: 疗休养
    category: 不得列支
    match: substring
    source: {file: 规则清单, clause: "第?条", text: "工会疗休养不从差旅费列支", confidence: 原生文本}
    action: 命中即不符合
    must_hit: ["工会组织疗休养活动", "疗休养费用"]
    must_not_hit: ["治疗费", "医疗保险", "休息日加班", "疗养院体检", "休养生息"]
    note: |
      三字完整词，不收「休养」也不收「疗养」。
      反例里的「疗养院体检」是另一回事（职工体检），归不到差旅费，
      但若把词收成「疗养」就会命中它，所以留在反例里钉住。

# ----------------------------------------------------------------------------
# 命中后的输出要求
# ----------------------------------------------------------------------------
on_hit:
  control_type: 警告
  message_template: "「{field}」命中敏感词「{term}」（{category}），请人工确认实际消费内容"
  must_include_matched_text: true
  must_include_term: true
  note: |
    **提示里必须回显命中的原文片段和命中的词**，不能只说「发现敏感内容」。
    审核岗要能一眼看出是不是误报——命中「黄山」的单子，看到回显的
    「福州黄山路XX酒店」就立刻知道是路名，三秒结束；只说「发现敏感内容」
    则要重新翻一遍发票。
    回显的原文片段同样要过脱敏（见 事实模型_v0.1.json 的 masking 段）。

# ----------------------------------------------------------------------------
# 缺口
# ----------------------------------------------------------------------------
gaps:
  G-33:
    title: 敏感词表里 12 个词是按「等」字外延推断的，需业务侧确认
    detail: |
      规则表第 3 条明示的只有 KTV、SPA、黄山、九寨沟 四个；第 4 条明示的只有
      「洗浴」一个。本表另加的 12 个词（水疗/夜总会/歌舞厅/足浴/高尔夫/按摩/
      足疗/景点门票/烟酒 等）全部标了 confidence: 外延推断 + needs_confirm。
      **这 12 个词每一个都会直接产生警告**，所以不能默认启用就上线。
      建议做法：v0.1 只启用 5 个 verbatim 词，12 个推断词置 enabled: false，
      等业务侧逐个确认后再开。
    impact: 12 个词的启用与否
    owner: 费用应付部
    blocking: false
    interim: "verbatim 的 5 个词先上，推断的 12 个词先只统计命中数不出警告，用真实数据量一量误报率再决定。"
