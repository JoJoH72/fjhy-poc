# 四、市内交通费标准
# ═══════════════════════════════════════════════════════════
local_transport:
  clause: 细则第二十条
  confidence: OCR
  basis: 按出差自然（日历）天数计算，遇有节假日的不得加倍计算
  base_rate: {amount: 80, unit: 元/人·天（包干使用）}
  deduction_tiers:
    - {condition: 由分公司全程提供交通工具, amount: 0, note: 不再报销市内交通费}
    - {condition: 由分公司或其他单位提供交通工具，仅往返市际交通中转站（火车站、长途汽车客运站、轮船码头、飞机场）, amount: 40, unit: 元/人·当天}
    - {condition: 同一天内出发地和目的地**均**有提供交通工具往返中转站, amount: 0}
    - {condition: 由接待单位或其他单位提供交通工具, amount: 0, note: 应向其交纳相关费用并取得凭证，否则不再报销市内交通费}
    - {condition: 接待单位协助提供交通工具且有收费标准, rule: 按标准交纳，最高不超过日市内交通费标准}
    - {condition: 接待单位协助提供交通工具且无收费标准, rule: 每人每半天按日标准的 50% 交纳}
  cross_check:
    note: |
      **与单据样本对账，80 元/天这个数也是对的，且解释了一个「异常值」。**
      样本里「市内交通费补贴」金额为 80 / 120 / 160 / 240 / 320 / 720。
      80 的整数倍解释了除 120 以外的全部；而 120 = 80 + 40，
      正好对应「其中一天只往返中转站」的 40 元档。
      若不知道有 40 元这一档，120 会被当成异常值误报。
      **这就是「漏读一档比漏读一条规则更危险」的实例。**
    checked_at: 2026-10-18
  air_travel:
    clause: 细则第二十一条 + 审核要点 2.1.4
    rule: 乘坐飞机的，往返驻地和机场的专线地铁（含城际铁路）、专线商务车（定制包车除外）费用可凭据据实报销，**不包括出租小汽车**；可同时领取当天交通补贴
    confidence: OCR
  special_rules:
    - {subject: 闽运集团, rule: "常驻地地级市外出差 80 元/人·天；常驻地地级市跨县出差 50 元/人·天；在榕人员当天往返闽侯、连江贵安、长乐机场不发放", clause: 审核要点 2.3.1 表第 3 行, confidence: 原生文本}
    - {subject: 泉州港务, rule: "中心城区不发；市域中心城区以外当日往返不报市内交通费；需住宿的按细则执行；住权属企业内部招待所的不报市内交通费", clause: 审核要点 2.3.1 表第 5 行, confidence: 原生文本}
    - {subject: 闽深公司, rule: 无交通补贴，按相关凭据实报实销（不超过日上限 80 元）；出租车发票不抵税, clause: 审核要点 2.3.2.5, confidence: 原生文本}
    - {subject: 闽货、饮食服务公司, rule: "无交通补贴，凭据实报实销：流通事业部按 80 元/天包干，其他部门按不超过出差天数×50 元/天的上限；不进差旅补贴科目，从交通费科目列支", clause: 审核要点 2.3.2.6, confidence: 原生文本}
    - {subject: 已配备公务用车的权属企业负责人, rule: 不得重复领取公务交通补贴；不得以顺路同行、搭便车等形式乘坐本单位、下属企业、合作关联单位公务车辆, clause: 审核要点 2.1.18, confidence: 原生文本}

# ═══════════════════════════════════════════════════════════
# 五、城市间交通费与交通工具等级
# ═══════════════════════════════════════════════════════════
intercity_transport:
  clause: 细则第五条~第十条
  confidence: OCR
  grade_table:
    status: 无法录入
    confidence: null
    why: |
      细则第六条下方的交通工具等级表是扫描表格，OCR 结果为
      「人《1) 分公 炎过交认《软认、 / 等应"全天你驴列于| 二等双| 任据报销」这类乱码，
      单元格与职级的对应关系无法复原。人眼读图也因该页表格线断裂、
      文字重影而无法可靠还原。
      **后果：TR-D4-01「交通坐席等级符合制度标准」不编译为硬规则，判「待人工」。**
      这是有意的，不是漏做——编一个等级表出来，比不判危险得多。
    needed_from_client: 该表的电子版，或人工录入一次（约 10 行）
    gap: G-03
  known_rules:
    - {rule: 出差人员应当按规定等级乘坐交通工具，据实全额报销；未按规定等级的超出部分自理, clause: 细则第六条, confidence: OCR}
    - {rule: "超标准乘坐交通工具需书面说明并经分管领导和总经理审批，可乘坐高一等级。特殊情形两种：①因工作需要随同省级及相当职务人员、随同重要客人出差；②遇有紧急公务，购票时对应等级无票", clause: 细则第七条, confidence: OCR}
    - {rule: 到出差目的地有多种交通工具可选择时，在不影响公务、确保安全的前提下应选乘经济便捷的交通工具, clause: 细则第八条, confidence: OCR}
    - {rule: 乘坐飞机的，民航发展基金、燃油附加费等可凭据报销, clause: 细则第九条, confidence: OCR}
    - {rule: 乘坐飞机、火车、轮船等交通工具的，每人次可购买交通意外保险一份；分公司已统一购买的不再重复报销, clause: 细则第十条 + 审核要点 2.1.20, confidence: OCR}
    - {rule: 符合乘坐火车软卧条件而改乘软座的，不给予补助, clause: 闽财行〔2023〕12号 解答6, confidence: 原生文本}
    - {rule: 原则上乘坐全列软席列车软座；晚 8 时至次日晨 7 时期间乘车时间 6 小时以上，或连续乘车超过 12 小时的，经单位领导批准可乘软卧, clause: 闽财行〔2023〕12号 解答10, confidence: 原生文本}
    - {rule: 不提倡驾驶私家车出差。私家车燃料费、维修费、过桥过路费、停车费等不能报销，也不能作为城市间交通费票据；无城市间交通费票据的凭住宿费发票计算报销伙食补助费和市内交通费，当天往返按 1 天计发, clause: 闽财行〔2023〕12号 解答9, confidence: 原生文本}
    - {rule: "铁路票据：乘车日期在 2025-09-30 后的纸质铁路车票不可报销入账和抵扣进项税额，应取得铁路电子客票", clause: 审核要点 2.1.16, confidence: 原生文本}
    - {rule: "退票手续费：需取得数电专票，发票抬头为公司名称的按现代服务-其他现代服务 6% 抵扣；蓝色动车票退票小票为铁路自制内部票据，不属法定增值税抵扣凭证，不得抵扣", clause: 审核要点 2.1.16, confidence: 原生文本}
    - {rule: 大巴车票发票备注姓名、身份证号码的，可按政策规定抵扣进项税额, clause: 差旅费审核规则 第 11 条, confidence: 原生文本}

