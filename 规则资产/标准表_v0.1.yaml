# 差旅费标准表 v0.1
#
# 全部来自《差旅费管理实施细则》（闽港财智〔2025〕20号）与《差旅费共享审核要点》。
# 该细则 PDF 是**纯扫描件无文字层**，所以每条都带 confidence 字段标明取得方式：
#
#   confidence: 人眼读图   —— 把扫描页渲成 PNG 后由人直接读表，可用于硬规则
#   confidence: OCR        —— Tesseract chi_sim 识别所得，**不得直接进硬规则阈值**
#   confidence: 原生文本   —— PDF 自带文字层，可用于硬规则
#
# 为什么要分这三档：同一份文件里，正文段落 OCR 得很准（「每人每天100元包干使用」
# 一字不差），而表格 OCR 结构彻底错乱（附件1 的城市与金额对应关系全丢）。
# 混在一起标「已OCR」，就会有人拿着错位的数字去编译硬规则。
#
# 实测反例：文号「闽港财智〔2025〕20号」被 OCR 成「赣港财知2025] 20号」。
# 文字都能错成这样，表格里的数字错位只会更隐蔽——它看上去仍是个合理的数。

meta:
  version: v0.1
  date: 2026-10-18
  source_file: 2.1关于印发《差旅管理实施细则》的通知（闽港财智〔2025〕20号）.pdf
  source_pdf_pages: 27
  source_text_layer: false
  extracted_by: [Tesseract 5.4.0 chi_sim, 人眼读图]
  reviewed_by: null        # ← 业务专家审定后填写姓名与日期，在此之前整表视为草稿
  review_date: null

# ═══════════════════════════════════════════════════════════
# 一、常驻地界定（决定「算不算出差」，是所有差旅规则的前置）
# ═══════════════════════════════════════════════════════════
residence:
  - id: RES-01
    subject: 福建省港口集团有限责任公司财智分公司
    scope: 福州市区（鼓楼区、台江区、仓山区、晋安区、马尾区）
    rule: 在此区域内执行公务，不属于出差
    clause: 细则第三条
    confidence: OCR
    note: 本 POC 单据样本的核算主体全部是财智分公司，所以这一条对全部 40 张单都生效。

  - id: RES-02
    subject: 在榕企业（通用）
    scope: 福州市区（鼓楼区、台江区、仓山区、晋安区、马尾区）
    rule: 同 RES-01
    clause: 附件4 解答1
    confidence: OCR

  - id: RES-03
    subject: 在榕企业人员到长乐区（除机场外）
    rule: 暂按出差执行
    clause: 附件4 解答2
    confidence: OCR

  - id: RES-04
    subject: 在榕企业人员到闽侯县、连江县贵安参加会议培训
    rule: 不报销住宿费、伙食补助费和市内交通费
    clause: 附件4 解答2 / 闽财行〔2023〕12号 解答4
    confidence: 原生文本
    note: 闽财行〔2023〕12号 有文字层，与本细则附件4 OCR 互为印证，两处一致。

  - id: RES-05
    subject: 在榕企业人员到闽侯县、连江县贵安、长乐机场开展其他公务活动，当天往返
    rule: 不报销住宿费、伙食补助费和市内交通费；确因工作原因误餐经批准发误餐补助 50 元/人·天（接受接待除外）
    clause: 附件4 解答2
    confidence: OCR
    conflict:
      with: 闽财行〔2023〕12号 解答4
      their_value: 每人每天发放伙食补助 40 元
      our_value: 每人每天发放误餐补助 50 元
      resolution: 取 50 元（本企业细则附件4）
      why: |
        基准优先级（用户 2026-10-18 确认）是「制度PDF > 审核要点 > 场景表 > 规则表」，
        但两份都是制度PDF。此时取**适用主体更近**的一份：
        闽财行〔2023〕12号 是福建省财政厅针对**省直机关**的解答，
        闽港财智〔2025〕20号 附件4 是**本企业**细则。企业细则优先。
        **此裁决需业务侧确认（缺口 G-11）** —— 40 元与 50 元差的是钱，不是措辞。

  - id: RES-06
    subject: 漳州港务
    scope: 古雷港经济开发区
    rule: 该区域内公务不属于出差；当天往返漳浦、云霄、东山、厦门机场、厦门动车站执行公务，不报销住宿费、伙食补助、市内交通费
    clause: 审核要点 2.3.1 表第 4 行
    confidence: 原生文本
    priority_over: RES-01
    note: 人员兼任多地职务的，以办公日数较多地点作为常驻地。

  - id: RES-07
    subject: 泉州港务
    scope: 泉州中心城区（鲤城区、丰泽区、洛江区万安/双阳街道、泉州经开区、台商投资区）
    rule: 赴该范围出差不发放补助
    clause: 审核要点 2.3.1 表第 5 行
    confidence: 原生文本
    priority_over: RES-01

  - id: RES-08
    subject: 闽运集团
    rule: 平潭公司常驻地为福州市；在榕人员当天往返闽侯、连江贵安、长乐机场不发放市内交通费
    clause: 审核要点 2.3.1 表第 3 行
    confidence: 原生文本

# ═══════════════════════════════════════════════════════════
# 二、住宿费限额标准（附件1 节选 —— 人眼读图，可用于硬规则）
# ═══════════════════════════════════════════════════════════
accommodation:
  applicability:
    clause: 细则第十二条
    confidence: OCR
    rule: |
      「出差人员住宿限额标准，按照福建省国资委所出资企业工作人员赴全国各地
       差旅住宿费标准明细表（附件1）执行。**分公司人员按照表中"其他人员"
       住宿费标准执行**。」
    implication: |
      财智分公司**全体人员（含公司领导）住宿费一律取「其他人员」列**。
      这条特别规定优先于第十三条「在职务级别对应的住宿费标准限额内」的通用表述。
      所以本 POC 的住宿费硬规则**不需要职级字段**——少一个依赖，少一处判不了。
    unit: 元/人·天（上限，不再限制房型）
    basis: 按实际住宿天数计算报销，限额内凭据报销
    clause_14: 细则第十四条

  table_scope_note: |
    **只录入本 POC 用得上的行。** 附件1 覆盖全国 30+ 省市，共 8 页表格。
    40 张单据样本的出差地全部在福建省内（福州、泉州、漳州、厦门、宁德、莆田、
    南平邵武、平潭）与北京 1 张。录入这些 + 一线城市兜底，其余按「待录入」处理，
    命中时判「待人工」而不是按 0 判超标。
    **全表录入是客户给电子版或人工录一次的事，不是 OCR 能干的**——
    附件1 的 OCR 结果里城市与金额的对应关系已经完全错乱。

  rates:
    - {province: 福建, area: 福州市、泉州市、平潭综合实验区, leader: 480, other: 380, confidence: 人眼读图, page: 13}
    - {province: 福建, area: 其他地区,                       leader: 480, other: 350, confidence: 人眼读图, page: 13}
    - {province: 厦门, area: 全市,                           leader: 650, other: 520, confidence: 人眼读图, page: 13}
    - {province: 北京, area: 全市,                           leader: 980, other: 750, confidence: 人眼读图, page: 12}
    - {province: 上海, area: 全市,                           leader: 900, other: 750, confidence: 人眼读图, page: 13}
    - {province: 浙江, area: 杭州市,                         leader: 650, other: 520, confidence: 人眼读图, page: 13}
    - {province: 浙江, area: 其他地区,                       leader: 640, other: 440, confidence: 人眼读图, page: 13}
    - {province: 江苏, area: 南京市、苏州市、无锡市、常州市、镇江市, leader: 640, other: 490, confidence: 人眼读图, page: 13}
    - {province: 江苏, area: 其他地区,                       leader: 640, other: 470, confidence: 人眼读图, page: 13}
    - {province: 广东, area: 广州市,                         leader: 830, other: 680, confidence: 人眼读图, page: 13}
    - {province: 广东, area: 珠海市、佛山市、东莞市、中山市、江门市, leader: 720, other: 590, confidence: 人眼读图, page: 13}
    - {province: 广东, area: 其他地区,                       leader: 690, other: 550, confidence: 人眼读图, page: 13}
    - {province: 江西, area: 全省,                           leader: 610, other: 460, confidence: 人眼读图, page: 13}
    - {province: 安徽, area: 全省,                           leader: 600, other: 460, confidence: 人眼读图, page: 13}
    - {province: 宁波, area: 全市,                           leader: 590, other: 460, confidence: 人眼读图, page: 13}
  rates_not_loaded:
    behavior: 待人工
    why: |
      出差地不在上表时**不得按 0 或按最低档判超标**。附件1 还有 20+ 省未录入，
      按缺失值判超标会把合规单据判成问题件——
      一份正常交付物被打上不可信警告，比漏判更伤。

  seasonal:
    note: |
      附件1 另有「旺季浮动标准」三列（旺季地区 / 旺季期间 / 旺季上浮价）。
      福建、厦门两行**旺季列为空**，所以本 POC 场景用不到。
      录入其他省份时必须连旺季一起录——只录基准价会把旺季的合规住宿判成超标。
    examples_seen: [张家口市 7-9月及11-3月 880/680, 秦皇岛市 7-8月 880/650, 承德市 7-9月 750/750]
    confidence: 人眼读图

  over_standard_exceptions:
    clause: 细则第十五条 + 附件2
    confidence: OCR
    approval: 提供书面说明并经分管领导和总经理审批后，可报销超标准住宿费
    cases:
      - 按规定参加全国性、国际性展会活动、重大活动（广交会、上交会、厦门98投洽会、进博会等），或在此期间出差该地点
      - 出差期间所到地点举办其他国际性、全国性及省市级重大活动（外宾来访、运动会、单项赛事、洽谈会、交易会、展会等）造成住宿费普遍上涨
      - 出差期间遇国家法定节假日造成住宿费普遍上涨
      - 遇到重大或突发事件需紧急出差处理
      - 到常驻地以外参加会议、培训学习和行业部门组织的调研、论坛、沙龙等活动，由举办方统一安排住宿但由本企业支付
      - 其他特殊商务活动
    fallback: 除以上六种情形外，提交分公司支部委员会或总经理办公会研究决定
    engine_note: |
      这六种情形**不能由引擎判定**——引擎读不出「是否恰逢广交会」。
      工程落法：超标准时命中 TR-D4-02，但若「补充说明」非空则降级为软规则
      TR-D9-01（说明充分性）交大模型研判，并在报告里列出这六种情形供人工对照。

  special_rules:
    - {subject: 福州港务, rule: 住宿发票需注明入住时间、离店时间、人员姓名，按人员分别开具, clause: 审核要点 2.3.1 表第 1 行, confidence: 原生文本}
    - {subject: 东南守押, rule: "住宿发票需列明住宿天数、间数；公司领导、中层管理人员、分公司班子可安排单人间，其他员工同性同行须住双人间（执行单人住宿限额），人员为奇数时可安排单人间", clause: 审核要点 2.3.1 表第 2 行, confidence: 原生文本}
    - {subject: 福建福港拖轮有限公司、福建荔兴拖轮有限公司（增员差旅费）, rule: 住宿标准每人每晚 200 元以内凭据报销, clause: 审核要点 2.2.2, confidence: 原生文本}
    - {subject: 福建省海运集团中平船舶管理有限公司, rule: "日常差旅费报销环节暂无法取得住宿费及机票发票，仅凭住宿清单先行报销，款项挂账于携程旅行社、建发国旅等；月末对公对账后冲销", clause: 审核要点 2.3.2.4, confidence: 原生文本, poc_relevant: true, note: 本 POC 主体为海运集团，这条是必查项}
    - {subject: 通用, rule: 住宿费发票抬头不得开具出差人员个人姓名，应开具分公司全称（含名称、纳税人识别号、地址电话、开户行），原则上应开具增值税专用发票, clause: 细则第十四条, confidence: OCR}
    - {subject: 通用, rule: 不同职级人员一同出差的，住宿费发票应分别开具或列出每人住宿费明细清单, clause: 细则第十四条, confidence: OCR}
    - {subject: 通用, rule: 异地工作人员出差目的地在其居所常驻地范围内的，原则上应回居所住宿，不报销住宿费（因工作需要统一住宿等特殊情况除外）, clause: 细则第十三条, confidence: OCR}
    - {subject: 通用, rule: "午休房：当天往返但公务活动超过半天，或当天目的地涉及两个及以上市县，或因工作需要延迟退房的，房费按出差目的地住宿费限额标准的 50% 以内凭据报销，须提供 12 时后退房证明及情况说明", clause: 闽财行〔2023〕12号 解答3, confidence: 原生文本}

