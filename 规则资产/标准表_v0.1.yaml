# 三、伙食补助费标准
# ═══════════════════════════════════════════════════════════
meal_allowance:
  clause: 细则第十七条
  confidence: OCR
  basis: 按出差自然（日历）天数计算，遇有节假日的不得加倍计算
  unit: 元/人·天（包干使用）
  rates:
    - {area: 省内, amount: 100}
    - {area: 省外（西藏、青海、新疆）, amount: 120}
    - {area: 省外（其他省份）, amount: 100}
  cross_check:
    note: |
      **与单据样本对账，这个数是对的。** 样本里「伙食补助费」出现的金额为
      100 / 200 / 300 / 400 / 600 / 900，全部是 100 的整数倍，
      且 FJPG-BX2610132121（摘要写明 9.28-9.29，2 天）金额正好 200。
      OCR 的「100元」「120元」与真实业务数据互相印证，这条可以进硬规则。
    checked_at: 2026-10-18
  deductions:
    - {rule: 接待单位按规定安排商务接待或一次公务接待工作餐的，不用交纳伙食费, clause: 细则第十八条, confidence: OCR}
    - {rule: 一天内由两家不同接待单位各安排一次工作餐，或由接待单位安排不止一次商务接待的，当天不再领取伙食补助费, clause: 细则第十八条, confidence: OCR}
    - {rule: "接待单位协助安排其他就餐的，应交纳伙食费：有收费标准按标准交（最高不超过日伙食补助费标准）；无收费标准的，早/午/晚分别按日标准的 20%/40%/40% 交纳", clause: 细则第十八条, confidence: OCR}
    - {rule: 由会议、培训举办方统一安排食宿并承担费用的，伙食补助费按往返各 1 天计发，当天往返按 1 天计发, clause: 审核要点 2.1.11 + 细则第三十条, confidence: 原生文本}
    - {rule: 往返当天由举办单位免费提供两餐（午餐、晚餐）的，不再发放伙食补助费, clause: 审核要点 2.1.11, confidence: 原生文本}
    - {rule: 往返当天由举办单位免费提供一餐的，可按全天标准领取伙食补贴（部分单位从严管控，不超过国资委核定上限即可）, clause: 审核要点 2.1.11, confidence: 原生文本}
    - {rule: 因私停留、绕道期间食宿费个人自理；伙食补助费按出差天数扣除停留绕道天数计发, clause: 细则第二十三条 + 闽财行〔2023〕12号 解答12, confidence: 原生文本}
  special_rules:
    - {subject: 泉州港务, rule: "泉州市域中心城区以外当日往返 50 元/人·天（接受接待除外）；需住宿的 50 元/人·天；省内其他设区市 100 元/人·天；省外西藏、青海、新疆 120 元/人·天，其余省份 100 元/人·天", clause: 审核要点 2.3.1 表第 5 行, confidence: 原生文本}
    - {subject: 福港拖轮、荔兴拖轮（增员差旅费）, rule: 伙食补贴每人每天 50 元以内凭据报销, clause: 审核要点 2.2.2, confidence: 原生文本}
    - {subject: 被抽调异地协助专项工作, rule: 按每人每天 100 元发放伙食补助费，不再报销市内交通费；省内每月不超过 2 次，省外每两月不超过 1 次（一往一返计 1 次）, clause: 附件4 解答8, confidence: 人眼读图}

