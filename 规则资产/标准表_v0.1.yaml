thresholds:
  - id: TH-01
    subject: 海运集团
    rule: 船舶事项 3000 元以上费用报销需附《事权审批单》
    amount: 3000
    clause: 审核要点 1.3.9.1
    confidence: 原生文本
    poc_relevant: true
  - id: TH-02
    subject: 海运集团
    rule: 机关事项 1000 元以上费用报销需附《事权审批单》
    amount: 1000
    clause: 审核要点 1.3.9.1
    confidence: 原生文本
    poc_relevant: true
    note: |
      **40 张样本里 28 张金额 ≥ 1000**，若本细则适用于财智分公司，
      这 28 张都该有事权审批单。但 1.3.9.1 的主语是「海运集团」，
      样本的核算主体是「财智分公司」——**两者是不是同一适用范围，待业务侧确认
      （缺口 G-12）**。这条不自行推定适用，否则会一次性误报 28 张。
  - id: TH-03
    subject: 海运集团
    rule: 资金支付金额不超过事权审批金额 5% 的（除船舶厂修外），作必要说明即可，无需另行补充事权审批手续；超过 5%（含）的应就差额部分补充
    rate: 0.05
    clause: 审核要点 1.3.9.1
    confidence: 原生文本
  - id: TH-04
    subject: 福港下属单位
    rule: 单笔 200 万元以上大额资金支付（含劳务派遣费用）需福港本部审批；短期内拆单支付总额超 200 万元的同样需审批
    amount: 2000000
    clause: 审核要点 1.3.9.2
    confidence: 原生文本
    note: 差旅场景金额远低于此，本 POC 不会命中。录入是为了完整性与拆单检测的口径留存。

gaps:
  - id: G-11
    item: 当天往返闽侯/连江贵安/长乐机场的误餐补助是 40 元还是 50 元
    why: 省财政厅解答（闽财行〔2023〕12号 解答4）写 40 元，本企业细则附件4 解答2 写 50 元。
         本表暂取 50 元（企业细则更近），但这是钱的事，需业务侧拍板。
  - id: G-12
    item: 审核要点 1.3.9.1 的《事权审批单》要求是否适用于财智分公司
    why: 条文主语是「海运集团」，而 40 张样本的核算主体是「财智分公司」。
         适用则 28 张单据缺附件，不适用则一条都不该报。差别是 28 条误报。
  - id: G-13
    item: 附件1《住宿费标准明细表》全表与交通工具等级表的电子版
    why: 本表只录入了样本用得上的 15 行；全国 30+ 省未录。
         交通工具等级表 OCR 与人眼读图都失败，完全无法录入。
