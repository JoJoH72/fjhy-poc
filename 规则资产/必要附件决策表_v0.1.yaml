# ============================================================================
# 必要附件决策表 v0.1   —   TR-D6-01 的唯一数据来源
# ----------------------------------------------------------------------------
# 来源：材料/差旅审核制度规则/财务共享业务场景核算及审核规则.xlsx ·「业务域」表
#       筛选条件：系统单据 == 「单人/多人差旅报销单」
#       实测 153 行，按（业务大类编码 × 业务小类编码）去重后 **29 行**
#       附件口径原文去重 25 种（差异多为空格/换行），归一后 17 种实质组合
#
# 【实测核对】29 行的 row_count 相加 = 24+45+43+37+4 = 153，与筛选行数一致。
#            不是抽样，是全量。
#
# 【为什么是一张表而不是 29 条规则】
#   TR-D6-01 是一条参数化规则（logic.type = decision_table）。场景表新增一个
#   业务小类时改这张表、不改规则，也不动引擎。表由规则管理员在「规则本体」
#   栏目维护，走发布管理的版本化流程。
#
# 【最重要的一条纪律】
#   must（必要附件）缺失       → 可拦截（control_type = 禁止）
#   optional（个性化附件）缺失 → **绝不拦截，连警告都不出**
#   场景表里「个性化附件：租车合同或协议」只在实际租车时适用。把它当必要项，
#   会把绝大多数正常单据判成缺件——29 行里有 12 行带个性化附件（41%），
#   其中 13 处是「租车合同或协议」。
#
# 【TR-D6-01 的 rows 字段已由 25 改为 29】
#   v0.1 草稿写的 25 是「附件口径原文去重数」，不是决策表行数。决策表的键是
#   （大类,小类），29 行。已同步修正 规则清单_v0.1.json。
# ============================================================================

meta:
  version: "0.1"
  rule_id: TR-D6-01
  source_file: "财务共享业务场景核算及审核规则.xlsx"
  source_sheet: "业务域"
  source_filter: "系统单据 == 单人/多人差旅报销单"
  source_confidence: 原生文本          # xlsx 单元格，非 OCR，可直接编译
  rows: 29
  source_rows: 153
  unique_attachment_texts: 25
  normalized_combinations: 17
  key: [业务大类编码, 业务小类编码]
  fallback_key: [业务大类编码, 业务小类]   # CL001000 住船补贴 的小类编码在源表为空，见 G-27
  maintainer: 规则管理员（领域知识资产 → 规则本体）

# ----------------------------------------------------------------------------
# 附件类型字典：归一后的代码 ← 场景表原文
# 原文里的「X/Y」斜杠含义未定（且 / 或），统一建模为 any_of 并标 needs_confirm。
# 见 G-25：若实为「两者都要」，A01/A02 这一项会从 28 行里全部漏报。
# ----------------------------------------------------------------------------
attachment_types:
  A01: {name: 出差审批单,         raw: 出差审批单,         ocr_needed: false, note: "OA 单据，共享侧目前只能看到有没有这个附件，看不到里面的字段——缺口 G-04"}
  A02: {name: 差旅费明细表,       raw: 差旅费明细表,       ocr_needed: false}
  A03: {name: 交通费报销凭证,     raw: 交通费报销凭证,     ocr_needed: true,  note: "要判「是否含往返行程」（TR-D6-05）必须读内容，不能只看文件名"}
  A04: {name: 住宿费发票,         raw: 住宿费发票,         ocr_needed: true}
  A05: {name: 其他差旅费发票,     raw: 其他差旅费发票,     ocr_needed: true}
  A06: {name: 会议或培训通知,     raw: 会议或培训通知,     ocr_needed: true,  note: "名为「附件1.pdf」的文件是不是会议通知，只有读了才知道"}
  A07: {name: 报名回执,           raw: 报名回执,           ocr_needed: true}
  A08: {name: 租车合同或协议,     raw: 租车合同或协议,     ocr_needed: false}
  A09: {name: 租房合同,           raw: 租房合同,           ocr_needed: false}
  A10: {name: 安全资金确认表,     raw: 安全资金确认表,     ocr_needed: false}
  A11: {name: 安全资金使用表,     raw: 安全资金使用表,     ocr_needed: false}
  A12: {name: 部门审核的补贴清单, raw: 部门审核的补贴清单, ocr_needed: false}
  A13:
    name: 事权审批单
    raw: 《事权审批单》
    ocr_needed: false
    in_table: false
    source: "2.3 差旅费共享审核要点.pdf 1.3.9.1（不在场景表里）"
    note: "**不进本表。** 它是按核算主体 + 金额触发的（TR-D6-04），不是按业务小类，适用范围还未定（G-12）。混进本表会对 28 张样本误报。"

# ----------------------------------------------------------------------------
# 费用明细名称 → 业务小类 的别名映射
# ----------------------------------------------------------------------------
# **这一段是实测逼出来的，不是设计出来的。**
# 本表的键是（业务大类, 业务小类），但真实单据里没有「业务小类」字段，
# 只有「业务类型」（= 业务大类名）和费用明细行的「费用明细」（≈ 业务小类名）。
# 拿 40 张样本的 182 条费用明细行直接按名字去撞这张表，命中 165 行（90.7%），
# 落空 17 行。逐条看落空原因：
#   · 9 行的费用明细叫「住宿费（参加会议产生）」——场景表里根本没有这个小类名，
#     它对应的是 CL002006「住宿费」。差一个后缀，9 行全漏。
#   · 8 行属于单据 FJPG-BX2609041860，这张单在「2多人差旅报账单」表里不存在，
#     取不到业务类型，见 G-30。
# 加上下面 3 条别名后命中 174 / 182 = 95.6%，剩下 8 行全是那张孤儿单。
#
# 别名表必须可维护（放在「规则本体」栏目里编辑），因为费用项目名称由各单位
# 自行维护，一定会继续长出新的写法。**不能靠改代码跟。**
expense_item_aliases:
  - {from: 住宿费（参加会议产生）, to_code: CL002006, to: 住宿费, hits: 9,
     note: "单人 3 行 + 多人 6 行。场景表无此名，按去掉括号后缀归并。"}
  - {from: 市内交通补贴,   to_code: CL006004, to: 市内交通费补贴, scope: CL006000, hits: 0,
     note: "CL006000 下场景表写「市内交通**费**补贴」；样本在 CL006000 下用的也是带「费」的写法，故 hits=0。保留此别名是为了防反向写法。"}
  - {from: 市内交通费补贴, to_code: CL002004, to: 市内交通补贴,   scope: CL002000, hits: 0,
     note: "CL002000 下场景表写「市内交通补贴」（无「费」）；样本在 CL002000 下用的也是无「费」的写法，故 hits=0。同为防反向写法。"}

# ----------------------------------------------------------------------------
# 样本实测覆盖（2026-10-18 跑的，不是估的）
# ----------------------------------------------------------------------------
sample_coverage:
  bills: 40                    # 单人 33 + 多人 7
  detail_rows: 182             # 单人 108 + 多人 74
  hit_before_alias: 165        # 90.7%
  hit_after_alias: 174         # 95.6%
  miss_after_alias: 8          # 全部属于孤儿单 FJPG-BX2609041860，见 G-30
  biz_types_in_sample: [国内差旅费, 国内差旅费(参加会议/培训产生）]
  note: |
    样本只覆盖到 29 行里的 10 行（CL006000 的 4 个小类 + CL002000 的 4 个小类
    + 培训费）。CL001000 安全类、CL004000 外派、CL003000 职工教育经费一张样本都没有。
    **演示时不要宣称这 19 行「已验证」——它们只是已配置。**

# 「情况说明」不是附件，是例外出口。TR-D6-02/03/05/06 都以「补充说明非空」收口，
# 对应本体概念 C0116（报账单.补充说明）。本表只管附件在不在，不管说明——
# 两者混在一起会让「缺件」和「缺说明」两种结论分不开。

# ----------------------------------------------------------------------------
# 29 行决策表
#   row_count = 该（大类,小类）在源表中的行数（源表一个场景会按行业重复若干行）
#   variants  = 该组合在源表里出现的附件口径原文变体数
#               variants > 1 且归一后相同 → 仅空格差异，无害
#               variants > 1 且归一后不同 → 源表自相矛盾，取多数并标 conflict
# ----------------------------------------------------------------------------
rows:

