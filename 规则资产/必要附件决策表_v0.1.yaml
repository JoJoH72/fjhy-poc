    with: "CL006001 国内差旅费/伙食补助费、CL002001、CL001001、CL003003"
    their_value: "补贴类小类只要 A01/A02，不要票据"
    our_value: "外派「差旅补贴」要 A03 交通费凭证 + A04 住宿费发票"
    resolution: 照抄源表，不统一
    why: "外派补贴与国内伙食补助是两种不同的补贴，源表对外派要求更严有其道理。替客户统一口径是改规则，不是实现规则。"
