# ===== CL002000 国内差旅费(参加会议/培训产生）（43 行）=====
# 大类名的左括号是**半角 "("**、右括号是**全角 "）"**。源表原文如此，
# 不要「顺手修正」，否则按名称匹配会全部落空。匹配一律走编码。

- key: {大类编码: CL002000, 大类: 国内差旅费(参加会议/培训产生）, 小类编码: CL002006, 小类: 住宿费}
  row_count: 7
  variants: 1
  must: [{any_of: [A01, A02]}, A04]
  optional: [{any_of: [A06, A07]}]
  conflict:
    with: "同大类下 CL002007 / CL002004 / CL002003 / CL002001 / CL002008 / CL002009"
    their_value: "会议或培训通知/报名回执 = **必要**附件"
    our_value: "同一项在本行被列为**个性化**附件"
    resolution: 照抄源表（本行按个性化处理，不拦截）
    why: |
      同一大类内 7 个小类，6 个把通知列为必要、唯独住宿费列为个性化。
      这要么是源表笔误，要么是「住宿费已有发票佐证、不必再要通知」的刻意设计。
      两种解释导出相反动作：按必要处理会对这 7 行报「缺会议通知」；
      按个性化处理则放过。我按源表字面取个性化——**宁可漏报也不误报**，
      且 TR-D6-02（会议培训类需上传通知文件，警告级，绑 N04）已对整个
      CL002000 大类兜一层，漏报风险被 AI 审核那一层接住。
    needs_confirm: true
    gap: G-26

