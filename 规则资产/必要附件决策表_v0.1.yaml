  row_count: 6
  variants: 1
  must: [{any_of: [A01, A02]}, A03, A04]
  optional: [A09]
  note: "住宿费小类却把 A03 交通费报销凭证列为必要——源表如此，照抄。"

- key: {大类编码: CL004000, 大类: 外派差旅费, 小类编码: CL004003, 小类: 其他差旅费}
  row_count: 6
  variants: 1
  must: [{any_of: [A01, A02]}, A05]
  optional: []

- key: {大类编码: CL004000, 大类: 外派差旅费, 小类编码: CL004002, 小类: 交通费}
  row_count: 6
  variants: 2
  variants_identical_after_normalize: true    # 两个变体只差空格数量
  must: [{any_of: [A01, A02]}, A03]
  optional: [A08]

- key: {大类编码: CL004000, 大类: 外派差旅费, 小类编码: CL004001, 小类: 差旅补贴}
  row_count: 6
  variants: 1
  must: [{any_of: [A01, A02]}, A03, {id: A04, conditional: 若是租房费用需提供合同（A09）}]
  optional: [A08]
