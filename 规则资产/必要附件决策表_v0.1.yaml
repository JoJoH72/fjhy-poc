# ----------------------------------------------------------------------------
# 未命中时的行为
# ----------------------------------------------------------------------------
on_key_not_found:
  action: 待人工
  emit_violation: false
  note: |
    **键未命中时不得按「最严」或「最宽」兜底。**
    按最严（要求全部附件类型）→ 新业务小类上线当天全部单据被拦；
    按最宽（不要求任何附件）→ 这条闸对新小类静默失效。
    正确做法是出一条「场景未配置，转人工」的提示，并写入 improve_log，
    让规则管理员知道该补表了。这同时是 SDAFI 的 I 阶段输入。

# ----------------------------------------------------------------------------
# 本表引入的缺口（接本体 G-24 之后）
# ----------------------------------------------------------------------------
gaps:
  G-25:
    title: 「出差审批单/差旅费明细表」斜杠语义未定
    detail: |
      源表 33 行必要附件里都写「出差审批单/差旅费明细表」。斜杠是「或」还是「且」？
      建模为 any_of（或）。若实为「且」，则本表 28 行（除 CL006010）在只上传
      其中一份时应报缺件而现在不报——**28 行全量漏报**。
      同样的斜杠还有「会议或培训通知/报名回执」（10 行必要）与
      「安全资金确认表/使用表」（8 行个性化，不拦截故无影响）。
    impact: 28 行的判定方向
    owner: 费用应付部
    blocking: false
    why_not_blocking: "按 any_of 实现是宽松侧，只会漏报不会误报。确认后改 1 个字段即可收紧。"
  G-26:
    title: CL002006 住宿费：会议通知列为个性化，同大类其余 6 个小类列为必要
    detail: 见该行 conflict 字段
    impact: CL002000/CL002006 这 7 行是否报「缺会议通知」
    owner: 费用应付部
    blocking: false
  G-27:
    title: CL001000 住船补贴的业务小类编码在源表为空
    detail: |
      源表 2 行，「业务小类编码」列为空单元格。CL006000 下的同名小类有编码
      CL006009。疑为源表漏填，建议客户补 CL001009 之类的编码。
      在客户补之前，加载器用（大类编码,小类名）兜底并打 WARN。
    impact: 2 行
    owner: 共享中心（源表维护方）
    blocking: false
  G-28:
    title: 外派「差旅补贴」要票据，国内「伙食补助费」不要——补贴类口径不一致
    detail: 见 CL004001 行的 conflict 字段
    impact: CL004000/CL004001 这 6 行
    owner: 费用应付部
    blocking: false
  G-29:
    title: 报账单附件清单字段在 40 张样本中 100% 为空
    detail: |
      **实测**：单人「1差旅费报账单」的「发票文件」「事前附件」两列，33 行全空；
      「1报销附件」表的「附件」列，33 行全空；多人「2多人差旅-报销附件」表的
      「报销附件」列，7 行全空。三条路都是空的，不是只空了一条。
      也就是说：导出给共享侧的数据里**没有附件清单**。
      TR-D6-01 是禁止级硬规则，输入全空会让它对 40/40 张单都报「必要附件缺失」
      ——误报率 100%，整个演示会被这一条淹掉。所以 TR-D6-01 置 compiled: false，
      阻塞原因记为数据源缺失而非建模缺失（表本身已就绪）。
      需要确认的是：附件是另有影像系统、还是导出时漏了这几列。
    impact: TR-D6-01 整条（29 行决策表全部）
    owner: 共享中心（数据接口方）
    blocking: true
    why_blocking: "这是 D6 维度 6 条规则里 3 条的共同前提。不解决，附件完整性这一类审核只能靠人工。"
  G-30:
    title: 孤儿明细——单据 FJPG-BX2609041860 有 8 条费用明细但无报账单主表行
    detail: |
      「2多人差旅-费用明细」里出现 8 个单据号，「2多人差旅报账单」里只有 7 个，
      FJPG-BX2609041860 只在明细表和费用行里出现，主表与报销附件表都没有它。
      取不到业务类型 → 决策表无法匹配 → 这 8 行永久落在表外。
      **加载器对这种情况必须报错退出，不能静默丢弃也不能凭明细凭空造一张单。**
      静默丢弃会让 8 行费用从此不被任何规则看到；凭空造单会让后面所有按核算主体、
      业务类型判的规则拿到一个编出来的值。
    impact: 8 条费用明细行（多人样本的 10.8%）
    owner: 共享中心（数据接口方）
    blocking: false
