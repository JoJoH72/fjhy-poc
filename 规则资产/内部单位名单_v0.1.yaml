# ============================================================================
# 内部单位名单 v0.1   —   TR-D9-05 的例外名单
# ----------------------------------------------------------------------------
# 条文依据（2.3 差旅费共享审核要点 · 2.1.5，原生文本）：
#   「出差地点，至少要写到市级，不可以只写到省级…若部分单位出差地点是写对方
#    公司名称的，须补充对应市级地点（**省港集团内部单位且地址明确的除外**，
#    可直接填写单位名称，例如港口集团，泉州港务，科技集团等）」
#
# 这张名单就是那个「除外」。它的作用是**放过**，不是拦截——
# 命中名单 ⇒ TR-D9-05 不报「出差地点未写到市级」。
#
# 【所以这张名单的误报方向是反的，要特别注意】
#   名单**多收**一个单位 → 该单位的单据永远不用写市级 → TR-D9-05 对它失效，
#     而 TR-D9-05 失效会连带 TR-D4-02（住宿费标准匹配）一起失效，
#     因为条文自己说了理由：「省级范围跨度过大，无法匹配住宿费报销标准」。
#   名单**少收**一个单位 → 该单位的正常单据被报「地点未写到市级」，是误报。
#   两个方向都有代价，所以每条都标 confidence，拿不准的放 unconfirmed 段，
#   **不默认启用**。
#
# 【city 字段为什么大半是「待确认」】
#   住宿费限额是按市定额的（见 标准表_v0.1.yaml accommodation，福州/泉州/平潭
#   480·380，福建其他 480·350，厦门 650·520）。city 猜错一位，住宿费标准就
#   选错一档。「泉州港务」推成泉州市尚属合理，「科技集团」「东南守押」
#   「财智分公司」的办公地我没有任何材料能证实，**一律留空标待确认，不猜**。
#
# 【本文件全部用块式映射，不用 flow mapping】
#   写第一版时用了 `- {name: x, note: |}` 这种写法，YAML 不允许在 flow mapping
#   里放块标量，直接解析失败。本体文件里同样的错误犯了 5 次。
#   纪律：**只要条目里有多行 note，就用块式。**
# ============================================================================

meta:
  version: "0.1"
  rule: TR-D9-05
  also_affects: [TR-D4-02, TR-D4-10, TR-D4-11]
  source:
    file: "2.3 差旅费共享审核要点.pdf"
    clause: "2.1.5"
    confidence: 原生文本
  maintainer: 规则管理员（领域知识资产 → 规则本体）
  effect: 命中则豁免「出差地点须写到市级」这一条，不产生任何告警
  built_from: "40 条报账单摘要（C0115）的单位名抽取 + 审核要点 2.1.5 与 2.3 直管企业段"
  caveat_from_source: |
    下面的单位名**不是我列的，是从 40 张样本的 40 条摘要里扫出来的**
    （脚本 scratchpad/sum_scan.py）。但摘要是自由文本（C0115），
    真正的「出差地点」字段在 OA 出差审批单里、尚未同步（G-04），
    所以这张名单上线前必须用真实的出差地点字段再核一遍。见 G-34。

# ----------------------------------------------------------------------------
# 一、条文明示（2.1.5 原文举例，三个）—— 可直接启用
# ----------------------------------------------------------------------------
verbatim:
  - name: 港口集团
    aliases: [福建省港口集团, 福建省港口集团有限责任公司]
    city: null
    city_status: 待确认
    confidence: 条文明示
    enabled: true
    note: 2.1.5 原文第一个例子。集团本部办公地未在材料中出现，city 留空。

  - name: 泉州港务
    aliases: [泉州港务集团]
    city: 泉州市
    city_status: 名称可推
    confidence: 条文明示
    enabled: true
    occurrences: 4
    note: |
      2.1.5 原文第二个例子。摘要里出现 4 次（「报泉州港务集团驻点差旅费」）。
      标准表 RES 段另有「泉州港务中心城区」的常驻地特殊口径，两处口径要对齐。

  - name: 科技集团
    aliases: []
    city: null
    city_status: 待确认
    confidence: 条文明示
    enabled: true
    occurrences: 1
    note: |
      2.1.5 原文第三个例子。摘要里出现 1 次（「厦门新立基/科技集团业财培训」），
      与厦门并列出现，但**不能据此断定它在厦门**——同一张单可以跑两个地方。

# ----------------------------------------------------------------------------
# 二、要点 2.3 列明的直管企业（5 家）—— 条文级证据
# ----------------------------------------------------------------------------
directly_managed:
  - name: 福州港务
    aliases: [福州港务集团]
    city: 福州市
    city_status: 名称可推
    confidence: 要点2.3明示
    enabled: true

  - name: 东南守押
    aliases: []
    city: null
    city_status: 待确认
    confidence: 要点2.3明示
    enabled: true
    note: 名称里没有地名，办公地无材料可考，city 留空。

  - name: 闽运
    aliases: [闽运集团]
    city: null
    city_status: 待确认
    confidence: 要点2.3明示
    enabled: false
    note: |
      **「闽运」两个字要特别小心，所以这一条故意 enabled: false。**
      摘要里出现了 6 个带「闽运」的不同单位：闽运福清、闽运平潭公司、
      闽运长乐公交公司、漳州闽运公交公司、连江闽运公司、永泰闽运公司。
      它们在 6 个不同的县市。
      子串「闽运」会把这 6 个全部豁免掉，于是这 6 个地方的住宿费标准
      全都匹配不上——而平潭的标准（480/380）和福建其他（480/350）是不同的。
      下面把 6 家逐一列出并各自给 city；集团本部若要豁免，
      请业务侧给出本部全称再单独加一条，不要用两个字的子串。

  - name: 漳州港务
    aliases: [漳州港务集团]
    city: 漳州市
    city_status: 名称可推
    confidence: 要点2.3明示
    enabled: true
    occurrences: 2
    note: 标准表 RES 段另有「漳州港务古雷港」的常驻地特殊口径。

  - name: 泉州港务（直管企业段重复列明）
    aliases: []
    city: 泉州市
    city_status: 名称可推
    confidence: 要点2.3明示
    enabled: false
    duplicate_of: verbatim.泉州港务
    note: 与 verbatim 段的「泉州港务」是同一家，置 false 避免同名条目重复参与匹配。

# ----------------------------------------------------------------------------
# 三、样本摘要里观测到、名称自带地名的单位 —— 启用，city 由名称推出
# ----------------------------------------------------------------------------
# 这些单位名本身已含市/县级地名，所以即使豁免「写到市级」，住宿费标准
# 仍然匹配得上——豁免它们是安全的。这是本段与第四段的区别。
observed_with_place:
  - name: 宁德港务
    aliases: [宁德港务集团]
    city: 宁德市
    city_status: 名称可推
    occurrences: 4
    enabled: true

  - name: 莆田港务
    aliases: []
    city: 莆田市
    city_status: 名称可推
    occurrences: 2
    enabled: true

  - name: 平潭港务
    aliases: []
    city: 平潭综合实验区
    city_status: 名称可推
    occurrences: 2
    enabled: true
    note: |
      平潭在住宿费标准表里与福州、泉州同档（480/380），
      不是「福建其他」（480/350）。归到「福建其他」会把 380 的标准
      压成 350，产生超标准误报。

  - name: 闽运福清
    aliases: [福清闽运]
    city: 福清市
    city_status: 名称可推
    occurrences: 1
    enabled: true

  - name: 闽运平潭公司
    aliases: []
    city: 平潭综合实验区
    city_status: 名称可推
    occurrences: 1
    enabled: true

  - name: 闽运长乐公交公司
    aliases: []
    city: 长乐区
    city_status: 名称可推
    occurrences: 1
    enabled: true
    note: 长乐已撤市设区，属福州市。住宿费按福州档（480/380）。

  - name: 漳州闽运公交公司
    aliases: []
    city: 漳州市
    city_status: 名称可推
    occurrences: 1
    enabled: true

  - name: 连江闽运公司
    aliases: []
    city: 连江县
    city_status: 名称可推
    occurrences: 1
    enabled: true
    note: |
      标准表 RES 段提到「当天往返闽侯/连江贵安/长乐机场」的补助口径冲突
      （G-11，40 元 vs 50 元，暂取 50）。本条与那条是两回事，不要混。

  - name: 永泰闽运公司
    aliases: []
    city: 永泰县
    city_status: 名称可推
    occurrences: 1
    enabled: true

  - name: 福清宏源公司
    aliases: []
    city: 福清市
    city_status: 名称可推
    occurrences: 1
    enabled: true
    note: |
      没给「宏源」这个短别名。两个字的子串命中无关公司的概率太高，
      而本名单一旦误命中就是「永久豁免」，代价比漏豁免大。
      要加别名请先确认不与 external_denylist 冲突。

  - name: 邵武客运公司
    aliases: []
    city: 邵武市
    city_status: 名称可推
    occurrences: 1
    enabled: true

  - name: 厦门轮船公司
    aliases: []
    city: 厦门市
    city_status: 名称可推
    occurrences: 3
    enabled: true
    note: 厦门住宿费标准是 650/520，与福建其他市差别很大，city 一定要对。

  - name: 厦门海隆
    aliases: []
    city: 厦门市
    city_status: 名称可推
    occurrences: 3
    enabled: true

# ----------------------------------------------------------------------------
# 四、观测到但是否「省港集团内部单位」无法确定 —— **默认不启用**
# ----------------------------------------------------------------------------
unconfirmed:
  - name: 厦门新立基
    aliases: [新立基]
    city: 厦门市
    city_status: 名称可推
    occurrences: 3
    enabled: false
    gap: G-34
    note: |
      摘要里出现 3 次，都是「前往厦门新立基驻点辅导」。驻点辅导通常是去
      权属企业，但「新立基」这个名字在任何一份制度或要点里都没出现过。
      **是不是内部单位，只能业务侧说。** 不过它名字带「厦门」，
      city 推得出来，所以即使不豁免也不会影响住宿费标准匹配——
      enabled: false 的代价只是这 3 张单会多一条「地点写到市级」的提示。
      宁可多一条提示，不可把一个外部单位当内部单位。

  - name: 财智分公司
    aliases: [福建省港口集团有限责任公司财智分公司]
    city: null
    city_status: 待确认
    enabled: false
    gap: G-34
    note: |
      40 张样本的核算主体全部是它，所以它是**出单方**，不是出差目的地。
      放进这张「出差地点豁免名单」属于类别错误，故 enabled: false。
      列在这里只是为了显式记录「已经考虑过并明确排除」——
      证明查过，和碰巧没看见，是两回事。

# ----------------------------------------------------------------------------
# 五、负面清单：摘要里出现过的外部机构，**明确不是**内部单位
# ----------------------------------------------------------------------------
# 这一段是给单元测试用的反例，也是给维护者的护栏：
# 以后往名单里加条目时，必须先确认不与本段冲突。
external_denylist:
  - name: 金蝶软件
    seen_in: 参加金蝶软件2026企业财务数智化转型论坛
    why: 软件厂商
  - name: 中兴新云
    seen_in: 2026.9.9-2026.9.11差旅费（中兴新云培训）
    why: 培训/软件供应商
  - name: 财司协会
    seen_in: 参加财司协会司库建设与运营交流会
    why: 行业协会
  - name: 中国CFO大会
    seen_in: 谢家清赴北京参加第二十届中国CFO大会
    why: 会议主办方，不是单位
  - name: 省属国企
    seen_in: 参加省属国企基层党支部书记培训示范班
    why: 泛指，不是具体单位

# ----------------------------------------------------------------------------
# 匹配与判定
# ----------------------------------------------------------------------------
matching:
  normalize: [去空白, 全角转半角]
  order:
    - "1. 先过 external_denylist：命中则**绝不豁免**，直接按 TR-D9-05 正常判"
    - "2. 再过 enabled: true 的条目（name 与 aliases 同等参与匹配）"
    - "3. 命中最长的那个键（「闽运长乐公交公司」优先于「闽运」）"
    - "4. 都不命中则按 TR-D9-05 正常判"
  longest_match_required: true
  longest_match_why: |
    **必须取最长匹配。** 否则「闽运长乐公交公司」会先被「闽运」命中，
    city 取到 null，住宿费标准就无从匹配；取最长匹配才能拿到 长乐区 → 福州档。
    这也是把「闽运」本身置 enabled: false 的原因之二。
  on_city_null: 待人工
  on_city_null_why: |
    豁免了「写到市级」却又拿不到 city，住宿费标准无从选档。
    这时**不能按「福建其他」兜底**——兜底档 350 比福州/泉州/平潭的 380 低，
    会把合规的 360 元住宿判成超标准。正确做法是这一项转人工。

# ----------------------------------------------------------------------------
# 缺口
# ----------------------------------------------------------------------------
gaps:
  G-34:
    title: 内部单位名单的范围未经业务侧确认，且目前只能建自摘要自由文本
    detail: |
      两层问题，分开说：
      (1) **范围**：要点 2.1.5 只举了 3 个例子（港口集团、泉州港务、科技集团），
          加上 2.3 的 5 家直管企业，共 8 条有条文依据。另外 13 条是从 40 条摘要里
          观测到的；2 条（厦门新立基、财智分公司）性质不明已置 enabled: false。
          请业务侧给一份完整的省港集团权属企业清单，连同各单位办公地所在市。
      (2) **数据来源**：真正的「出差地点」字段（C0402）在 OA 出差审批单里，
          尚未同步到共享系统（G-04）。本名单现在是拿摘要（C0115，自由文本）
          反推的，上线前必须用真实的出差地点字段重新核一遍——
          摘要里写「漳州驻点」，出差地点字段里写的可能是「漳州港务集团」，
          也可能是「漳州市」，两者命中与否完全不同。
    impact: TR-D9-05 的豁免面；连带 TR-D4-02 住宿费标准匹配
    owner: 费用应付部 + 共享中心（数据接口方）
    blocking: false
    interim: 有条文依据的 8 条（扣除重复与「闽运」共 6 条启用）+ 名称自带地名的 13 条先启用；性质不明的 2 条不启用。
