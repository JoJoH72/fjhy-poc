# ============================================================================
# L1 研判 Agent · 规则明细成形
# ----------------------------------------------------------------------------
# 职责：把切出来的东西变成**一行一条规则、要素成列**的明细。
# **全程确定性，不调模型、不出网、不计费。**
#
# 为什么必须有这个 Agent（实测出来的）：
#   这一栏叫「规则抽取」，但在它之前，产物是 176 条**条款**——文本切片，
#   不是规则。实测这条链对规则库的净贡献是 0 条
#   （82 条规则全是 created_by='asset_loader'，onto_adoption 一条没有）。
#
# 为什么它排在「规则草稿」**前面**（列映射优先于大模型）：
#   《差旅费审核规则.xlsx》的表头本来就是
#     序号 | 校验类型 | 校验规则 | 实现途径 | 校验方式 | 是否已有 | 评估共享是否可实现
#   那条唯一成功的付费草稿（58 秒）给出的「规则名称=交通费标准控制」和
#   「处置动作=禁止」，**原本就躺在第 2 列和第 5 列**；而模型给不出的
#   「实现途径=系统规则」「是否已有=是」反倒被丢了。
#   实测对照：列映射 35 条、0 元、0 幻觉，还多拿 4 个字段；
#   同样的内容交给模型，一条 58～150 秒并且要逐条核数值。
#   **把结构化数据降维成一行文本、再花钱让模型升维回来，是这一栏最贵的浪费。**
#
# 这个 Agent 最容易做错的地方不是读错字，是**列错位**，而错位有两种，
# 必须分开判——第一版混成一种，把 7 条干净的规则挡在了外面：
#   结构错位：本行列数与表头不一致，且没有一种对齐说得通 → 不映射，留原文
#   取值待定：列对齐没问题，只是某一格的值不在闭集合里
#            （实扫「实现途径」列客户自己填的是「？」「通过OA控制？」「AI智能审核？」）
#            → **该列留空、原值写进 note**，交人定。硬塞一个最接近的值，
#              后面会被当成事实。
# ============================================================================

agent_id: fj_l1_06_rule_detail
agent_version: "0.1.0"
layer: L1
name: 规则明细成形
description: 表格行按表头名映射、场景表按要点拆条，并把已成稿的 AI 草稿投影进同一张表；不调模型
execution_strategy: per_station

triggers:
  message:
    enabled: true
    channels: [fjhy_clause_ready, fjhy_draft_ready]
    why: |
      两个来源各自到位就醒一次：条款切好了先把表格行映射出来（不花钱），
      草稿成稿了再把它投影进同一张明细表。
      **不等草稿**：列映射本身就是有价值的产物，而草稿那一步要花钱、会失败，
      让不花钱的产物等花钱的那一步，就是把一次失败变成两次没有产出。
  heartbeat:
    enabled: true
    interval_seconds: 120
    why: 兜 NOTIFY 丢通知。这一步不出网，心跳空转的代价只有几个查询
  subscribe:
    enabled: false

sense:
  tables:
    - doc_lib_file
    - doclib_clause
    - doclib_draft
    - doclib_rule_detail
  select: |
    「表格行」策略切出来的条款，连同它所在工作表的**表头行与逐列原值**
    （由 doclib_extract.split_table_rows 一并带回，不另写解析器）。
    加上 rulable=true 的 AI 草稿。
  snapshot: false
  snapshot_why: 读的是制度文本与模型草稿，不是业务数据，没有脱敏入库的问题

decide:
  kind: 确定性列映射
  map_by: 表头名
  map_by_why: |
    **按表头名映射，不按列位置。** 两份规则表的列名、列数、列序都不同
    （规则表 7 列、算法表 15 列），按位置写死等于给每份文件写一套代码。
  anchors: [控制类型, 实现途径, 配置器状态, 是否已有]
  anchors_why: |
    这几列的取值范围是已知的（禁止/警告、系统规则/配置器/人工、有效/无效、是/否）。
    它们有两个用处，分清很重要：
      一、**定对齐**：列数与表头不一致时，哪种对齐违反闭集合最少就是它；
          并列时**尾部截断优先**——Excel 导出会裁掉尾部空列，这个机制是已知的，
          而「中间某列恰好空着」是没有证据的假设。
      二、**说取值**：对齐没问题而某格的值不在集里，那是源表这一格的事。
  upstream_fix: xlsx 解析必须保留空单元格的位置
  upstream_fix_why: |
    **这一条是根因，写在这里以免有人又把它优化掉。**
    app/doclib.py:_xlsx_text 第一版过滤掉了空单元格（「不求还原版式，只求字都在」），
    对全文检索够用，但列的位置就塌了：《系统审核算法.xlsx》表头 15 列、
    「审核算法规则」整列为空，数据行导出成 14 个值，之后所有列左移一格——
    按位置读，「控制类型」读到的是「自定义」、「状态」读到的是更新时间。
    保留空列之后，6 行算法 15 列全部对齐，映射从「7 种对齐都说得通」变成精确命中。
    **和 OCR 那条教训是同一句话：丢的不是字，是结构。**
  closed_set_only: true
  closed_set_only_why: |
    标签只能在闭集里取值（费用维度 D1..D10、控制类型、规则类型、实现途径、
    落地状态、来源类别、可信度）。模型给的取值一律先过闭集校验：
    实测两次调用给出的「审核维度」是「差旅费报销」和
    「人员身份，审批手续，交通住宿补贴，报销频次」——一个都不在 D1..D10 里。
    **对不上就留空由人填，不硬塞**——硬塞会让一条维度错的规则看起来填得整整齐齐。
  scenario_dedup: 按「每一条要点」的正文去重，再按条内序号拆
  scenario_dedup_why: |
    场景表的「专用审核要点」是客户**按业务小类逐行重复填**的：
    差旅+接待两类单据 163 行，要点正文只有 2 种。
    按行拆实测得到 41 条，其中要点 1~5 在 6 个分组里逐字相同、各发了一次。
    去重必须落在**每一条要点**上，去重后是 14 条。
    而分组之间真正的差别只在最后一条（「金额核对」后面多接了
    「机票保险费用不允许报销」「主办方提供餐食…不报补贴」这类句子）——
    那是**真的不同规则**，只适用于部分业务小类，所以各自成条，
    并把覆盖的业务小类与行数记在明细上：
    一条覆盖 142 行的规则和一条只在 1 个场景里出现过的规则，分量差一个量级。
  scenario_scope: [单人/多人差旅报销单, 招待费报账单]
  scenario_scope_why: |
    本次 POC 的范围是差旅 + 接待（用户 2026-10-19 指定）。
    其余 15 类单据（收入报账单、员工借款单…）不取，
    **但跳过了多少行必须报出来**（实测跳过 1523 行）——
    静默跳过会让下一个人以为这张表只有这些。
  conclusion_values: [已映射, 列对不齐, 取值待定]
  pending_counts_as: 列对不齐
  pending_why: |
    「列对不齐」要能和「取值待定」分开数：前者是结构问题，改源表或人工填；
    后者是源表里本来就没定的事，等业务定。合成一个数，两件事都不会被处理。

act:
  writes: [doclib_rule_detail, doclib_detail_tag, agent_signal, agent_signal_log]
  signal:
    channel: fjhy_detail_ready
    kind: detail_ready
  idempotency: "{clause_id}:{origin}"
  idempotency_why: |
    detail_id = md5(clause_id|origin)，重跑还是同一行（UPSERT），
    所以人工的采纳/驳回和人工标签留得住。
    origin 进键：同一条条款的「列映射」和「AI草稿」是两条明细，
    可信度不是一档，必须并排放着给人比。
  never_writes: [rule]
  never_writes_why: |
    **采纳只是标记，不写 rule 表。** 写进本体要填维度、优先级、绑定节点，
    那是「规则本体」那一栏的事。这里自动写进去，等于让没人填过的字段
    带着默认值进了规则清单。rule 不在 writes 里，不是约定不写，是能力上不给。

feedback:
  metrics:
    - name: false_positive
      desc: 映射成功但人工发现列读错了的条数。这个数非 0 就说明闭集锚不够
      source: doclib_rule_detail
    - name: false_negative
      desc: 被判「列对不齐」而其实对得齐的条数。实测踩过 7 条（尾部截断没给优先权）
      source: doclib_rule_detail
    - name: value_pending
      desc: 列对齐但取值不在闭集合的格子数（源表填的是「？」这类待定值）
      source: doclib_rule_detail
    - name: missing_for_adopt
      desc: 离进本体还差几项（维度/规则类型/控制类型/风险类别）的明细条数
      source: doclib_rule_detail
  separate_fp_fn: true
  separate_why: |
    **误报与漏报必须分开计。**
    误报=列读错了，一条规则带着隔壁列的控制类型进了清单，而它看起来有据可查；
    漏报=把对得齐的行判成对不齐，一条真规则就静默地不见了（实测 7 条）。
    合成一个「映射成功率」，两者都看不见。

improve:
  params:
    max_col_gap:
      default: 2
      bounds: [0, 4]
      why: |
        允许本行比表头少几列。差一两列还能靠闭集合定出唯一对齐；
        差更多只能靠猜，而猜错一列会让控制类型或阈值读到隔壁去
      wired_to: app/rule_detail.py:MAX_DROP
    detail_list_limit:
      default: 500
      bounds: [50, 2000]
      why: 清单一次最多取多少条。太大页面会卡，太小看不全一份文件
      wired: false
      wired_why: |
        接口参数直接传 limit（上限 2000 由 list_details 自己卡），
        没有从这里读。标出来而不是删掉：将来要做「按文件分页」就该接上。
  forbidden:
    - 规则内容
    - 阈值
    - 控制类型（禁止/警告）
    - 表头名到字段的映射关系（改它等于改「哪一列是控制类型」）
    - 闭集合的取值范围
    - 「并列时尾部截断优先」这条（去掉它实测挡住 7 条真规则）
    - 「取值不在闭集合就留空、不硬塞」这条
    - 「采纳不写 rule 表」这条（rule 不在 act.writes 里，改配置也写不进去）
