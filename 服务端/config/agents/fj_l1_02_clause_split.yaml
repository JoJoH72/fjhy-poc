# ============================================================================
# L1 研判 Agent · 条款切分
# ----------------------------------------------------------------------------
# 职责：把一份文件的正文切成条款，识别规则特征，与现有规则比对覆盖。
# **全程确定性，不调模型、不出网、不计费。**
#
# 为什么要和「AI 草稿」分成两个 Agent：
#   一个不出网不花钱，一个真调模型真计费。合成一个之后，
#   「为什么没出草稿」就有两种可能（切分没切出来 / 模型调用失败），
#   而这两种的处置完全不同：前者改切分策略，后者查 Key 和额度。
#   更要紧的是，合在一起就没法只跑前半段——
#   而前半段（制度里还有哪些条款没变成规则）本身就是有价值的产出。
#
# 切分策略按**文件形态**选，不是一套正则打天下。实扫逼出三种：
#   条款体   「第十条 …」          差旅管理实施细则、业务接待管理办法
#   层级编号 「1.3.9.1. …」        差旅费共享审核要点（PDF，没有「第X条」）
#   表格行   「5 | 交通费标准控制 | …」 差旅费审核规则.xlsx、系统审核算法.xlsx
#   场景拆条 业务域×单据×业务小类的场景矩阵，规则在「专用审核要点」那一列
#            财务共享业务场景核算及审核规则.xlsx（1709 行）
#   少一种就有一整类文件静默抽不到——而「抽到 0 条」看起来像「这份文件没规则」。
#   **场景拆条这一路就是实测踩出来的**：那张表 1709 行，切表格行要求行首是
#   序号数字，而它们行首是「费用报账域」，匹配 0 行；匹配上的 9 条全部来自
#   「业务域联系人」工作表——9 个真实姓名加手机号被当成规则条款入了库。
#   页面上显示「场景表切出 9 条」，看着像抽到了，其实一条规则都没有。
# ============================================================================

agent_id: fj_l1_02_clause_split
agent_version: "0.1.0"
layer: L1
name: 条款切分
description: 按文件形态选切分策略，切条款、识特征、比对现有规则覆盖，不调模型
execution_strategy: per_station

triggers:
  message:
    enabled: true
    channels: [fjhy_extract_requested]
    why: 正常路径。感知 Agent 投信号后醒来，处理单份文件
  heartbeat:
    enabled: true
    interval_seconds: 120
    why: |
      兜两件事：一是 NOTIFY 丢通知；
      二是**回收孤儿信号**——claimed 了但处理进程崩掉的信号，
      超过 claim_timeout 还没 done 就放回 pending。
      没有这一条，一次崩溃就会让那份文件永久卡在 claimed，而且不报错。
  subscribe:
    enabled: false

sense:
  tables:
    - doc_lib_file
    - doc_lib_ocr
    - doclib_clause
    - rule
  select: |
    单份文件的正文：原生文本优先（doc_lib_file.body），
    没有才用 OCR 文本（doc_lib_ocr 逐页拼，并带回页边界）。
    **OCR 过期的不用**（extract 时文件已被换过），否则是拿旧版制度抽规则。
    rule 表只读 source_clause，用于覆盖比对。
  snapshot: false
  snapshot_why: |
    不落快照：这里读的是制度文本，不是业务数据，没有脱敏入库的问题；
    而条款本身已经按条落进 doclib_clause，再存一份快照是重复。

decide:
  kind: 确定性切分与特征识别
  strategies: [条款体, 层级编号, 表格行, 场景拆条]
  strategy_pick: 各切一遍，取切出条数最多的那个；都为 0 则标「未识别」
  strategy_pick_why: |
    **按内容选，不按扩展名猜。** 审核要点是 PDF 却用层级编号，
    有的 docx 里是表格。猜错的代价是整类文件抽到 0 条，
    而 0 条看起来像「这份文件里没有规则」。
  sheet_filter: [说明, 联系人, 目录, 封面, 修订, 变更记录, 填表]
  sheet_filter_why: |
    **一个工作簿里不是所有工作表都是规则来源。**
    实扫《财务共享业务场景核算及审核规则.xlsx》有 3 个 sheet
    （说明 / 业务域联系人 / 业务域），而切出来的 9 条**全部来自联系人页**：
    9 个真实姓名 + 手机号，被当成「规则条款」入了库。
    它们没有规则特征所以没被送进模型——那是运气，不是设计。
    另加一条内容侧的闸：列很少、且某一列整个就是一个手机号的行不收。
    **只在「列少 + 整列是手机号」时判**，不是「行里有 11 位数字就扔」——
    规则条款里完全可能出现金额和编码，漏报和误报同样致命。
  features: [阈值, 数值, 禁止, 强制, 例外, 名单制]
  candidate_rule: 非范本非单据 + 带上述特征（数值除外）+ 现有规则未引用
  excluded_must_be_logged: true
  excluded_why: |
    被跳过的文件（单据、切不出条款的）必须逐份记原因并在页面上列出。
    只报「切出 185 条」而不说「另有 5 份单据跳过、1 份没切出来」，
    使用者会以为库里的制度都抽过了。
  conclusion_values: [切出条款, 未识别形态, 跳过]
  pending_counts_as: 未识别形态
  pending_why: |
    切不出来就说切不出来，**不硬凑**。
    硬凑的后果是整份文件当成一条丢给模型，模型在几千字里挑一条编出来，
    而没人能对上是哪一条。

act:
  writes: [doclib_clause, doclib_extract_task, doc_lib_file, agent_signal, agent_signal_log]
  signal:
    channel: fjhy_clause_ready
    kind: clause_ready
  idempotency: "{file_id}:{fingerprint}:{strategy}"
  idempotency_why: |
    策略进键：同一份文件换了切分策略，条款号口径就变了
    （「第十条」变成「第5行」），必须重切。
    只用文件指纹会让「改了解析器但文件没动」的那次重切被当成重复丢掉。
  clause_identity: "dlc- + md5(file_id|策略|条款号|同号第几次)[:12]"
  clause_identity_why: |
    **条款要有稳定身份，否则重切一次就把下游全断了。**
    第一版 clause_id 是 uuid4，而 run_split 每份文件先整份 DELETE，
    doclib_draft.clause_id 又是 ON DELETE CASCADE——
    实测：10-18 产的 14 条付费草稿（一条 150 秒）被 10-19 的重切静默清零，
    连带没的还有采纳/驳回结论和**驳回原因**，而那是「下次别再抽这条」的唯一记录。
    改成内容定址后，重切走 UPSERT，同一条条款还是同一行。
    **不用 seq**：文件前面插一条，后面所有 seq 全体位移，等于全部换身份。
    **要带「同号第几次」**：实扫有 3 处同份文件条款号重复
    （20号文第十六条、第二十一条各两次，解答六第三条两次）。
  deletes: 只删这次没再切出来的条款，并把「连带作废几条草稿」写进该文件的结论
  deletes_why: |
    整份清空是上面那次事故的直接原因。作废草稿这件事必须说出来——
    静默作废会让人下次看到「草稿 0 条」而以为模型没跑。

feedback:
  metrics:
    - name: false_positive
      desc: 被标成候选、但人工认定本来就不该成规则的条数（定义、职责、流程叙述类）
      source: doclib_clause
    - name: false_negative
      desc: 人工发现的、制度里有阈值却没被标成候选的条数
      source: doclib_clause
    - name: unsplit_files
      desc: 三种策略都切不出来的文件数。这个数上升说明来了新的排版形态
      source: doclib_extract_task
    - name: coverage_blind
      desc: 来源条款没写清文件/条款号、无法参与覆盖比对的规则条数
      source: rule
  separate_fp_fn: true
  separate_why: |
    **误报与漏报必须分开计。**
    漏报=制度里真有阈值却没指出来，该补的规则没补；
    误报=把名词解释条标成候选，人去逐条看完发现全是废话，下次就不看了。
    合成一个「准确率」会把误报的代价藏起来——而本功能的全部价值
    就是「还有多少条没变成规则」这个数字，它一失真功能就没了。

improve:
  params:
    max_clauses_per_file:
      default: 500
      bounds: [50, 2000]
      why: 一份 728 万字的 xlsx 能切出极多行，无上限会让单周期拖垮整条链
      wired_to: app/doclib_extract.py:MAX_CLAUSES_PER_FILE
    min_clause_chars:
      default: 12
      bounds: [6, 60]
      why: 太小会把只有标题的空条款收进来；太大会漏掉「第X条 略」后面接正文的情况
      wired_to: app/doclib_extract.py:MIN_TEXT
    claim_timeout_seconds:
      default: 300
      bounds: [120, 3600]
      why: 太短会把还在切的文件误判成孤儿而重复处理；太长则崩溃后恢复慢
      wired: false
      wired_why: |
        **这一条现在是文档，不是开关。** 这条链由页面手工启动、单进程跑完
        （app/agent_job.py），没有 claim / 孤儿回收那套机制，所以没有地方读它。
        标出来而不是删掉：常驻化之后它就该接上，删了下一个人会重新发明一遍。
        **声明了却没接线的参数必须自己说出来**——一页看着能调、实际不起作用的
        参数，比没有这页更糟。tests/test_extract_contract.py 钉住这件事。
  forbidden:
    - 规则内容
    - 阈值
    - 控制类型（禁止/警告）
    - 特征词表（改它等于改「什么算候选」的口径）
    - 覆盖比对的判定方式（只认文号与整串标题两种硬证据）
