# ============================================================================
# L2 协同 Agent · 本体对齐（双向对账）
# ----------------------------------------------------------------------------
# 职责：把归并组和现有规则本体**两个方向**对一遍，把结论落成台账。
#       不新增规则、不改规则、不裁决冲突——那三件都是人的动作。
#
# **为什么必须双向，单向会各漏一半：**
#   制度 → 落地   漏掉它，就看不出制度里写了而规则清单里根本没有的要求
#   规则 → 依据   漏掉它，就看不出那 82 条里有几条其实找不到制度依据
# 合成一个「覆盖率」更糟：两侧缺口的责任方和下一步动作完全不同——
# 左边要新增规则，右边要补台账或改规则。
#
# **三条「不许下断言」的边界**（都是 2026-10-19 实测逼出来的）：
#
# 一、「判不出」是独立档位，不许二分。
#    规则清单的 source_clause.file 存的是类别代号（规则表/要点/制度/场景表/
#    配置器/解答），不是文件名。实测代号在 14 份文件里的命中：
#      要点→1 份、制度→1 份、解答→1 份、规则表/场景表/配置器→0 份
#    一条写着「制度 第七条」的规则，可能指《国资委差旅制度》也可能指
#    《差旅管理实施细则》——**对不到唯一文件就不能下断言**。
#    实测这一条把「未落地」从 4 组降到 1 组：另外 3 组的来源出自
#    《业务接待管理办法》《差旅管理实施细则》和两份 xlsx，
#    规则清单压根没有能钉到它们的写法。
#    把这类算成「未落地」，人会去新增一条其实已经存在的规则，
#    而重复规则对同一张单会给出两条结论，比漏一条更难查。
#
# 二、条款号对不上 ≠ 查无依据。
#    实测 10 条规则的来源是款级（制度 第二十三条（三））、表内行
#    （要点 2.3.1 表第1行）、问答序号（解答 解答3）或「多处」。
#    它们都有依据，只是两套编号不同。标成「查无依据」会让人去改规则，
#    而该改的是切分粒度。**误报会让人动手改对的东西，比漏报更贵。**
#
# 三、「查无依据」这一档实测为 0，但档位保留。
#    「真的查无依据的：0 条」和「我们没查」是两件事，
#    只有把档位留着才说得出前一句。
# ============================================================================

agent_id: fj_l2_02_onto_align
agent_version: "0.1.0"
layer: L2
name: 本体对齐
description: 归并组与规则本体双向对账，落对账台账；不新增不改规则不裁决冲突
execution_strategy: batch

triggers:
  message:
    enabled: true
    channels: [fjhy_extract_coord_done]
    why: 归并与冲突识别完成后醒来。此时归并组齐了，对账才有对象
  heartbeat:
    enabled: true
    interval_seconds: 300
    why: |
      兜 NOTIFY 丢通知，以及**规则清单被改了但归并组没动**的情况——
      装载脚本重新装载规则资产后，对账结论就过期了，
      而那条路不经过归并 Agent，只有心跳能发现。
  subscribe:
    enabled: false

sense:
  tables:
    - doclib_rule_source
    - doclib_clause
    - doc_lib_file
    - doclib_conflict
    - rule
    - onto_align
    - onto_rule_cover
  select: |
    归并组的全部成员条款（带文件名、条款号、覆盖规则、切分策略、可信度），
    以及 rule 的 source_clause（来源文件代号 + 条款号）。
    **不读 onto_adoption**：采纳过的组照样要对账——
    采纳之后制度文件还可能改，改了结论就该变。
  snapshot: false

decide:
  kind: 双向对账
  forward_values: [已落地, 未落地, 判不出]
  reverse_values: [有制度依据, 仅规则表, 编号对不上, 查无依据, 来源未写明]
  match_basis: |
    只认硬证据：规则的 source_clause 里写的来源代号能唯一钉到一份文件，
    且条款号与归并组里某条条款的条款号**精确相等**。
    归一只做「去扩展名、去空白、去书名号」，相似度猜测一概不做。
  match_why: |
    把规则挂到错的制度文件上，比标「判不出」危险得多：
    前者给出一条看起来有据可查、实际指错地方的证据链，
    而复核的人未必回查原文。
  no_auto_rule: true
  no_auto_rule_why: |
    **对齐只产出结论，不产出规则。** act.writes 里没有 rule 表，
    也没有 onto_adoption——不是「约定不写」，是 WRITABLE_TABLES
    白名单里就没给这个能力。有一条「对账发现缺口就自动补一条规则」的路，
    迟早会有人走上去，而自动补出来的规则带着「有制度依据」的外观。
  pending_counts_as: 判不出
  pending_why: |
    判不出是不是已落地时落「判不出」，不落「未落地」。
    落后者会让人去新增一条其实已经存在的规则。

act:
  writes: [onto_align, onto_rule_cover, agent_signal, agent_signal_log]
  signal:
    channel: fjhy_onto_aligned
    kind: onto_aligned
  idempotency: "{group_set_hash}:{rule_set_hash}"
  idempotency_why: |
    归并组集合与规则集合**都**进键：任一侧变了，对账结论就可能变。
    只用归并组会漏掉「规则清单重新装载」这一路；
    只用规则集合会漏掉「又抽到一个新出处」这一路，
    而新出处恰恰可能是那个把「未落地」翻成「已落地」的。

feedback:
  metrics:
    - name: false_positive
      desc: 判了「未落地」但人工发现其实已有规则覆盖的组数。这类误报会导致新增重复规则
      source: onto_align
    - name: false_negative
      desc: 判了「已落地」但人工发现规则其实没覆盖该要求的组数。这类漏报让缺口被当成已完成
      source: onto_align
    - name: undecidable_ratio
      desc: 「判不出」占比。这个数高说明规则清单的来源字段该补文件名了，不是算法差
      source: onto_align
    - name: source_unwritten_count
      desc: 「来源未写明」的规则条数。实测 41 条（占一半），是台账口径缺口的直接指标
      source: onto_rule_cover
  separate_fp_fn: true
  separate_why: |
    **误报与漏报必须分开计。**
    误报=把已有规则覆盖的要求判成未落地，人照着新增一条重复规则，
    两条规则对同一张单给出两条结论，而两条都「有制度依据」；
    漏报=把没覆盖的要求判成已落地，那条制度要求就静悄悄地漏了，
    而报告上显示「已落地」。合成一个「准确率」两者都看不见。

improve:
  params:
    max_groups_per_cycle:
      default: 300
      bounds: [20, 2000]
      why: 对账要遍历组 × 条款，组数大时耗时线性涨，要有上限
    max_rules_per_cycle:
      default: 500
      bounds: [50, 2000]
      why: 反向对账按规则条数走。规则清单会长，上限按量级留
    claim_timeout_seconds:
      default: 600
      bounds: [120, 3600]
      why: 太短会把还在对账的批次误判成孤儿而重复处理；太长则崩溃后恢复慢
  forbidden:
    - 规则内容
    - 阈值
    - 控制类型（禁止/警告）
    - 对账的判定口径（三档/五档的含义与边界）
    - 「判不出」这一档的存在（不许被优化成二分，二分会制造重复规则）
    - 来源代号到文件的映射（代号命中多份时不许自动选一份）
