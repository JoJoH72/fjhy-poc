    # ───────────────────────────────────────────────────────────────────────
    # EN12 与 EN21 是**两个不同的东西**，一度被混成一个枚举，由
    # standard_limit.rank_level 的外键在装载时报错抓出来（0007 加的那个外键）。
    #   EN12 职级          —— 系统里「人」的字段取值，来自审批意见页「申请人」栏
    #   EN21 住宿费标准档位 —— 制度附件1 住宿费标准表的**列名**
    # 混在一起的后果很具体：财智分公司的「公司领导」会被按 480 判而不是 380，
    # 而 40 张样本的核算主体**全部是财智分公司**——一混就是全量误判。
    # 两者之间的映射见本段末尾的 rank_to_tier，映射不是恒等，还带主体条件。
    # ───────────────────────────────────────────────────────────────────────
    - id: EN12
      name: 职级
      source: 审批意见
      values: [其他员工, 部门负责人, 副总经理, 总经理]
      measured: {其他员工: 31, 总经理: 5, 部门负责人: 3, 副总经理: 1, 合计: 40}
      note: |
        **实测 4 档，取自 40 张单的审批意见页「申请人」栏**（格式「姓名/职级/部门」）：
        其他员工 31 / 总经理 5 / 部门负责人 3 / 副总经理 1。
        v0.1 初稿写的是 [公司领导, 其他员工] —— 「公司领导」这个取值在真实数据里
        **根本不存在**，是我从制度附件1 的标准表列名倒推出来的。
        枚举多一个表单上不存在的取值，规则就会去判一个永远为假的条件；
        少了三个真实取值，职级到住宿费档位的映射就查不到，整条链断在中间。
        这一处是解析审批意见 PDF 之后才核准的——在那之前 C0804 的可得性
        被标成「待业务侧明确」，而职级其实一直就在那份 PDF 里。
        附件1《住宿费标准明细表》的列头是另一套两档：
        「所出资企业领导班子」/「其他人员」。
        两套的对应关系**由细则第十二条直接给定**，不需要猜：
          「分公司人员按照表中"其他人员"住宿费标准执行」
        即**财智分公司全体（含公司领导）住宿费一律走「其他人员」列**。
        这是特别规定，优先于第十三条「在职务级别对应的住宿费标准限额内」
        这句通用表述。
        仍存疑的是交通工具等级（细则第六条按职级分档，表格 OCR 错乱读不出），
        见缺口 G-03。

