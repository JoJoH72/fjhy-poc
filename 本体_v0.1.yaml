      name: 特殊规则类别
      source: 审核要点
      values: [住宿, 补助, 授权, 报销方式, 交通]

    - id: EN21
      name: 住宿费标准档位
      source: 制度
      values: [公司领导, 其他人员]
      note: |
        **这是制度附件1 住宿费标准表的列名，不是人的职级。**
        与 EN12 职级的区别见上面 EN12 前的说明。
        细则第十二条原文：「分公司人员按照表中"其他人员"住宿费标准执行」。
        标准表_v0.1.yaml 据此写明：财智分公司**全体人员（含公司领导）
        住宿费一律取「其他人员」列**。

  # 职级 → 住宿费标准档位 的映射。**不是恒等映射，带主体条件。**
  # EN12 实测有 4 个职级，EN21 只有 2 个档位，所以这张表必须把 4→2 说清楚。
  rank_to_tier:
    # ① 财智分公司：**全员一律「其他人员」**，与职级无关（细则第十二条）。
    #    40 张样本的核算主体全是财智分公司，所以这 4 条覆盖了全部样本。
    - {subject: 财智分公司, rank: 其他员工,   tier: 其他人员, clause: 细则第十二条, confidence: 人眼读图,
       note: "细则第十二条：「分公司人员按照表中『其他人员』住宿费标准执行」。"}
    - {subject: 财智分公司, rank: 部门负责人, tier: 其他人员, clause: 细则第十二条, confidence: 人眼读图}
    - {subject: 财智分公司, rank: 副总经理,   tier: 其他人员, clause: 细则第十二条, confidence: 人眼读图,
       note: "**分公司的副总经理也走「其他人员」档。** 漏掉这条，这 1 张单会按 480 判而不是 380。"}
    - {subject: 财智分公司, rank: 总经理,     tier: 其他人员, clause: 细则第十二条, confidence: 人眼读图,
       note: "**分公司的总经理同样走「其他人员」档。** 实测有 5 张单的申请人职级是总经理。"}

    # ② 非分公司主体：按职级对应档位。附件1 只有两列，所以 4 个职级要归并成 2 档。
    - {subject: "*", rank: 总经理,   tier: 公司领导, clause: 细则附件1, confidence: 人眼读图}
    - {subject: "*", rank: 副总经理, tier: 公司领导, clause: 细则附件1, confidence: 人眼读图}
    - {subject: "*", rank: 其他员工, tier: 其他人员, clause: 细则附件1, confidence: 人眼读图}
    - {subject: "*", rank: 部门负责人, tier: null, on_unknown: 待人工, clause: 细则附件1,
       confidence: 人眼读图, gap: G-35,
       note: "**「部门负责人」归哪一档，制度没说。** 附件1 只有「公司领导」「其他人员」两列，部门负责人既不是公司领导也不只是普通员工。归「公司领导」会放宽 100 元/天，归「其他人员」会收紧 100 元/天——两个方向都可能错，所以非分公司主体的部门负责人一律转人工。缺口 G-35。实测样本里有 3 张单是部门负责人，但主体都是财智分公司，走①那一支，不受本条影响。"}

    # ③ 职级取不到：**不许兜底。**
    - {subject: "*", rank: null, tier: null, on_unknown: 待人工,
       clause: 细则, confidence: 人眼读图,
       note: "兜到「其他人员」（低档）会把合规的领导住宿判成超标（误报）；兜到「公司领导」（高档）会放过超标的普通员工（漏报）。两个方向都错，只能转人工。"}

  relations:
    - {from: E01, to: E02, type: 包含,   card: "1..n", source: 单据样本}
    - {from: E01, to: E03, type: 关联,   card: "0..1", source: 规则清单,
       note: 29 条表第 2 条「是否有关联审批单」。跟随领导当天往返的不需要审批，所以下限是 0}
    - {from: E01, to: E13, type: 包含,   card: "1..n", source: 场景表}
    - {from: E01, to: E12, type: 流转,   card: "1..n", source: 审批意见}
    - {from: E01, to: E09, type: 归属,   card: "1..1", source: 单据样本}
    - {from: E01, to: E04, type: 包含,   card: "0..n", source: 审核要点}
    - {from: E01, to: E11, type: 占用,   card: "0..1", source: 规则清单}
    - {from: E01, to: E16, type: 分摊,   card: "0..n", source: 规则清单}
    - {from: E01, to: E14, type: 需附,   card: "0..1", source: 审核要点}
    - {from: E02, to: E05, type: 凭据,   card: "0..n", source: 规则清单}
    - {from: E05, to: E06, type: 泛化,   card: "1..1", source: 审核要点}
    - {from: E05, to: E07, type: 泛化,   card: "1..1", source: 审核要点}
    - {from: E03, to: E04, type: 回填,   card: "1..n", source: 审核要点}
    - {from: E03, to: E08, type: 出差人, card: "1..n", source: 审核要点}
    - {from: E08, to: E09, type: 任职,   card: "1..1", source: 单据样本}
    - {from: E08, to: E10, type: 适用标准, card: "1..n", source: 制度}
    - {from: E09, to: E17, type: 适用特殊规则, card: "0..n", source: 审核要点}
    - {from: E01, to: E15, type: 依据,   card: "0..1", source: 场景表,
       note: 仅业务类型为「参加会议/培训产生」时成立}

  gaps:
    - id: G-01
      item: 直管企业特殊规则（2.3.1 五家 + 2.3.2 六条授权）与通用规则的逐条覆盖关系
      why: 材料给的是两张并列清单，没有「哪条特殊规则推翻哪条通用规则」的对应。
           漳州港务「古雷港经济开发区内公务不属于出差」会直接推翻通用的出差地判定，
           不问清就会在特殊单位上大面积误判。
    - id: G-02
      item: 报账单完整状态机
      why: 40 张样本全是「审批完成」，制单/审批中/已退回/已撤回等状态值一次没出现。
    - id: G-03
      item: 交通工具等级标准表（细则第六条下方表格）
      why: |
        住宿费的职级口径已由细则第十二条解决（分公司人员一律按附件1「其他人员」列），
        **不再是缺口**。但交通工具等级表是扫描件里的一张表格，OCR 结果彻底错乱
        （「人《1) 分公 炎过交认《软认、」这种），单元格对应关系无法复原。
        TR-D4-01「交通坐席等级」因此**无法编译成硬规则**，降级为「待人工」。
        要落地需客户提供该表的电子版或人工录入一次。
    - id: G-04
      item: OA 出差审批单到共享系统的字段同步范围与时点
      why: 29 条表第 20~23 条评估列写的是「OA**将**出差时间和出差地点同步给共享系统，
           可以实现」——是未来时。同步了哪些字段、什么时候同步，决定 8 条规则能不能跑。
    - id: G-05
      item: 商旅平台（携程、建发国旅）结算数据是否接入
      why: 审核要点 2.3.2.4 说海运集团中平船舶管理公司的住宿费与机票挂账于商旅平台，
           月末对公对账。单据样本里有「商旅结算」字段但 40 张全为 0.00。
           这条链路不通，该公司的住宿费规则无从校验。

# ═══════════════════════════════════════════════════════════════════
# 二、规则本体 —— 依据什么、怎么判
# ═══════════════════════════════════════════════════════════════════
rule_schema:

  note: |
    八要素沿用参照项目的规则本体结构，另加 5 个字段对齐客户现有配置器
    （材料/差旅审核制度规则/2.5 系统审核算法.xlsx 已落地 6 条）。
    对齐口径由用户 2026-10-18 确认。

  elements:
    - {field: rule_id,        name: 规则标识,   required: true,
       note: 本系统主键。格式 TR-<维度>-<序号>，TR = Travel}
    - {field: name,           name: 规则名称,   required: true}
    - {field: dimension,      name: 审核维度,   required: true, enum: dimensions}
    - {field: risk_class,     name: 风险类别,   required: true}
    - {field: source_clause,  name: 来源条款,   required: true,
       note: "必须含「文件名 + 条款号 + 原文摘录」三件。只写文件名不算。OCR 取得的原文另标 ocr=true"}
    - {field: scope,          name: 适用范围,   required: true,
       note: 业务类型 / 费用小类 / 核算主体 / 职级 / 金额区间 / 生效期}
    - {field: logic,          name: 判定逻辑,   required: true,
       note: 硬规则给表达式；软规则给提示词要点。阈值来自 OCR 的一律留空并标 pending_review}
    - {field: exception,      name: 例外情形,   required: false,
       note: 差旅规则的例外几乎都落在「补充说明」或「发票备注栏」，
             要写明例外出口在哪个字段}
    - {field: priority,       name: 优先级,     required: true,
       note: 数值越小越先判。直管企业特殊规则优先于通用规则}
    - {field: owner,          name: 责任部门,   required: true}
    - {field: effective,      name: 生效期,     required: true}

  configurator_alignment:
    note: |
      客户配置器现有字段，一一对齐。**「算法类型」现有取值只有「IT审核」一种**
      （6 条已落地算法全是它），而 29 条规则表里「实现途径」标 `AI智能审核？` 的有 2 条、
      标 `？` 的有 3 条、标 `通过OA控制？` 的有 2 条。
      本设计新增 `业务审核` / `AI审核` 两个取值与 `YWSH` / `AISH` 两个编码前缀，
      **这是新增口径，列入待业务侧确认（缺口 G-06），不替客户定**。
    fields:
      - {field: algo_code,   name: 算法编码, pattern: "^(ITSH|YWSH|AISH)\\d{4}$",
         note: 现有 6 条为 ITSH0001~ITSH0006}
      - {field: algo_type,   name: 算法类型, values: [IT审核, 业务审核, AI审核],
         existing_values: [IT审核], new: [业务审核, AI审核], gap: G-06}
      - {field: algo_group,  name: 算法分类, values: [常用算法], existing_values: [常用算法]}
      - {field: control_type, name: 控制类型, values: [禁止, 警告],
         note: 禁止 = 不允许提单（硬拦截）；警告 = 提示但可继续。
               现有 6 条全是「警告」——**一条「禁止」都还没上**，这是现状不是设计}
      - {field: algo_source, name: 算法来源, values: [自定义], existing_values: [自定义]}
      - {field: config_mode, name: 配置方式, values: [配置器], existing_values: [配置器]}
      - {field: status,      name: 状态,     values: [有效, 无效],
         note: 现有 6 条：有效 4（ITSH0001/0002/0005/0006）、无效 2（ITSH0003/0004）。
               无效那两条是「出差地校验：交通费发票与审批单一致」与
               「出差时间校验：出差日期不能晚于申请结束时间」——
               正好是依赖 OA 同步字段的两条，与缺口 G-04 吻合}

  dimensions:
    - {id: D1, name: 主体与账户一致性, note: 付款主体、发票抬头、代提单授权}
    - {id: D2, name: 审批单关联与一致性, note: 有无审批单、人/时/地/天数一致}
    - {id: D3, name: 票据合规性, note: 敏感开票单位、敏感词、红冲、票种与抵扣}
    - {id: D4, name: 标准与限额, note: 住宿、交通坐席、伙食补助、市内交通费}
    - {id: D5, name: 补贴计发口径, note: 会议培训免餐免车、往返各1天、当天往返}
    - {id: D6, name: 附件完整性, note: 按业务大类×小类的必要附件}
    - {id: D7, name: 时间逻辑, note: 发票开具时间、审批日期、回填日期、乘车日期}
    - {id: D8, name: 预算与分摊, note: 超预算、分摊对象与金额}
    - {id: D9, name: 说明充分性, note: 软规则——例外出口的说明是否充分}
    - {id: D10, name: 单位特殊规则, note: 直管企业特殊规则与授权情况}

  classes:
    - id: hard
      name: 硬规则
      exec: 规则引擎直接计算
      output: 通过/不通过
      note: 阈值必须有确认过的来源。来自 OCR 未复核的阈值**不得编译成硬规则**，
            降级为「待人工」——宁可不判，不可错判
    - id: mixed
      name: 混合规则
      exec: 硬条件过滤 + 模型判断
      output: 命中硬条件后给风险提示
    - id: soft
      name: 软规则
      exec: 本体约束下的大模型辅助
      output: 标注为「建议」附理由，必须人工复核

# ═══════════════════════════════════════════════════════════════════
# 三、术语映射 —— 制度用词 ↔ 共享系统字段 ↔ 配置器算法名
# ═══════════════════════════════════════════════════════════════════
glossary:
  note: |
    三栏对照。差旅场景的术语漂移比贸易融资更重——同一件事制度叫「伙食补助费」、
    单据叫「伙食补助费」、口语叫「餐补」、场景表专用审核要点叫「餐补」，
    而「市内交通费」在单据里有「市内交通费补贴」和「市内交通补贴」两个字面值。
    不钉死就会出现规则写了但一条都不命中。
  terms:
    - {institution: 伙食补助费, system_field: 费用小类=伙食补助费, colloquial: [餐补, 误餐补贴], concept: C0202}
    - {institution: 市内交通费, system_field: "费用小类 ∈ (市内交通费补贴 | 市内交通补贴)", colloquial: [交通补贴], concept: C0202,
       note: "两个字面值都要收，详见 EN04 的说明。源表 CL006000 写带「费」的，CL002000/CL001000/CL003000 写不带「费」的；真实单据两种都出现过（实测 27 : 3）。"}
    - {institution: 城市间交通费, system_field: 费用小类=交通费, colloquial: [大交通], concept: C0202}
    - {institution: 住宿费, system_field: "费用小类 ∈ (住宿费 | 住宿费（参加会议产生）)", concept: C0202}
    - {institution: 常驻地, system_field: 待业务侧明确, concept: C0805, gap: G-31,
       note: "单据样本里没有「常驻地」字段（实测 40 张、单人 19 列 + 多人 12 列，一列都没有）。出差地判定要用它，共享系统里有没有**待确认**。原先挂在 G-03 上，但 G-03 已重定义为「交通工具等级标准表无法录入」，属悬空引用，现独立为 G-31（定义见 规则绑定_v0.1.json）。"}
    - {institution: 出差审批单, system_field: 关联审批单, colloquial: [OA审批单, 出差申请单], concept: E03}
    - {institution: 核算主体, system_field: 报账人公司, concept: C0107,
       note: 明细表列名与审批意见页签名不同，是同一概念}
    - {institution: 出差回填, system_field: 出差审批单.回填日期+用餐情况+用车情况, concept: "C0308,C0309,C0310"}
    - {institution: 事权审批单, system_field: 附件类型=事权审批单, concept: E14,
       note: 海运集团专项，见审核要点 1.3.9.1}
    - {institution: 补充说明, system_field: 补充说明, colloquial: [备注, 说明栏], concept: C0116,
       note: 所有例外规则的出口。软规则 D9 的唯一输入}
  configurator_map:
    note: 客户配置器 6 条已落地算法 ↔ 本规则清单，逐条对照。这是「增量在哪里」的依据。
    pairs:
      - {algo_code: ITSH0001, algo_name: "出差时间校验：出差日期不能早于申请日期", status: 有效, rule_id: TR-D7-01}
      - {algo_code: ITSH0002, algo_name: "出差地校验：出差地点与日历区的地点不一致", status: 有效, rule_id: TR-D2-05}
      - {algo_code: ITSH0003, algo_name: "出差时间校验：出差日期不能晚于申请结束时间", status: 无效, rule_id: TR-D7-02,
         note: 配置器里标「无效」。依赖 OA 同步字段，与缺口 G-04 吻合}
      - {algo_code: ITSH0004, algo_name: "出差地校验：交通费发票与审批单一致", status: 无效, rule_id: TR-D2-06,
         note: 同上，标「无效」}
      - {algo_code: ITSH0005, algo_name: "出差人校验：出差人与出差审批单校验", status: 有效, rule_id: TR-D2-03}
      - {algo_code: ITSH0006, algo_name: "住宿发票开具时间校验：住宿发票开票时间不能早于出差时间", status: 有效, rule_id: TR-D7-03}

# ═══════════════════════════════════════════════════════════════════
# 四、流程本体 —— 在哪个环节判
# ═══════════════════════════════════════════════════════════════════
process:

  note: |
    **节点与迁移全部出自 50 页真实审批记录，一个都不是设计出来的。**
    客户流程里**已经存在一个「AI审核」节点**（审批人 `aiAudit/null`，
    意见为「AI审核通过」/「AI审核不通过」），位置在经办部门分管领导之后、
    共享审核之前。40 张单据里只有 5 张走过它，全部在 2026-10-10 之后——
    说明该节点刚上线。本 POC 的 AI 能力就挂在这个既有节点上，不新增流程节点。

  nodes:
    - id: N01
      name: 提单
      alias: [开始]
      actor: 提单人
      ai_entry: false
      rule_gate: true
      observed: 67
      note: |
        共享系统的提单界面。29 条规则表里「校验方式=禁止」的规则在这里拦截
        （原文多处写「不符合…的不允许提单」），「校验方式=警告」的在这里提示。
        这是**系统规则**的执行点，不是 AI 的。
    - id: N02
      name: 部门负责人审批
      actor: 部门负责人
      ai_entry: false
      observed: 35
    - id: N03
      name: 经办部门分管领导审批
      actor: 分管领导
      ai_entry: false
      observed: 33
      variant: {id: N03B, name: 综合部分管领导审批, observed: 5,
                note: 5 页审批记录里出现，与 N03 并列而非串联}
    - id: N04
      name: AI审核
      actor: aiAudit
      ai_entry: true
      observed: 5
      first_seen: "2026-10-10 14:05:15"
      note: |
        **本 POC 的 AI 能力入口。** 既有节点，不是新增。
        观察到的输出只有两态：「AI审核通过」/「AI审核不通过」。
        本设计在这两态之外增加「审核报告」与「证据链」作为共享审核岗的输入，
        但**不改变该节点原有的两态结论格式**——改了上游流程引擎就对不上。
        5 次实测：通过 2、不通过 3。
    - id: N05
      name: 共享审核·初审
      actor: 共享中心审核岗
      ai_entry: false
      observed: 97
      note: |
        「共享审核」在审批记录里出现 97 次，且**同一张单上连续出现两次**
        （不同审批人），所以拆为初审 N05 / 复审 N06。
        节点名在客户系统里是同一个「共享审核」，拆分是本设计为了说明两道关而做的，
        **是否真有初复审之分待业务侧确认（缺口 G-07）**。
    - id: N06
      name: 共享审核·复审
      actor: 共享中心复审岗
      ai_entry: false
      note: 见 N05 的说明
    - id: N99
      name: 流程结束
      actor: —
      ai_entry: false

    - id: N07
      name: 共享审核
      alias: []
      note: |
        由「本体构建」协同采纳。证据：审批记录出现 125 次，涉及 41 张单。
        **这个节点的 actor 与前后迁移待业务侧确认**——迁移没补全时它在流程图上是个孤点。
  bypasses:
    - id: B01
      name: 撤回
      observed: 12
      from: [N02, N03, N05]
      to: N01
      note: 审批记录里「撤回」后紧跟一条「开始」，即回到提单重走。
            AI 审核结论是否随之失效、重走时是否重跑 AI——**待业务侧明确（缺口 G-08）**
    - id: B02
      name: 审批人和报账人相同跳过
      observed: 3
      note: 出现在部门负责人或分管领导节点。审批人就是报账人时自动跳过该节点。

  transitions:
    - {from: N01, to: N02, cond: 默认}
    - {from: N01, to: N03, cond: B02 触发（部门负责人即报账人）}
    - {from: N02, to: N03, cond: 同意}
    - {from: N02, to: N03B, cond: 同意（综合部口径）}
    - {from: N03, to: N04, cond: 同意}
    - {from: N03B, to: N04, cond: 同意}
    - {from: N04, to: N05, cond: AI审核通过}
    - from: N04
      to: N05
      cond: AI审核不通过
      note: |
        **实测关键：AI审核不通过并不阻断流程。** FJPG-BX2610130821 在
        2026-10-13 17:25:03 得到「AI审核不通过」，17:35:41 仍进入共享审核并由
        人工给出退回理由。即 AI 结论是**参考**，闸门在人工手里。
        这与「AI 仅作辅助、不替代人工审批权责」的定位一致，不要改成硬阻断。
    - {from: N05, to: N06, cond: 同意}
    - {from: N05, to: N01, cond: 退回（意见非「同意」）}
    - {from: N06, to: N99, cond: 同意}
    - {from: N06, to: N01, cond: 退回}

  rule_binding:
    note: |
      **绑定依据是 29 条规则表的「实现途径」列，不是猜的。** 四档：
        系统规则      → N01 提单校验（22 条）
        AI智能审核？  → N04 AI审核（2 条）
        通过OA控制？  → **不进本系统执行集**（2 条），只列候选
        ？            → 待业务侧明确（3 条）
      另由审核要点与场景表派生的规则按同一原则归档。
    by_node:
      N01: {source: 实现途径=系统规则, count: 22}
      N04: {source: 实现途径=AI智能审核？, count: 2}
    out_of_scope:
      - node: OA系统
        source: 实现途径=通过OA控制？
        count: 2
        rules: [出差回填时间校验, 出差回填信息校验]
        why: |
          这两条的执行点在 OA，不在共享系统。写进本系统的执行集等于
          让 AI 声称复核了它读不到的数据——比少复核更危险。只列候选。
    pending:
      - {source: 实现途径=？, count: 3,
         rules: [会议培训方统一安排食宿的补贴计发, 举办方免费提供餐次的补贴扣减, 乘机往返机场专线费用与当日交通补贴],
         why: 29 条规则表的「实现途径」列原文就是「？」，客户自己也没定。
              不替客户填，列入缺口 G-09}

  unreachable_gate:
    note: |
      **漏报闸。** 绑在某节点上不等于会被跑到：若某维度绑定的节点里没有一个是
      AI 介入节点或规则闸节点，真实链路中就没人执行它。启动期查这种情况，
      发现即打告警到 stderr，并在 /api/health 里回报。
      参照项目靠这道闸抓出 2 处人工核对没看出来的漏报，闸自身要正反双向钉死：
      该报的必须报出、不该报的一条不许误伤。

  gaps:
    - id: G-06
      item: 配置器「算法类型」是否新增「业务审核」「AI审核」两个取值
      why: 现有 6 条算法全是「IT审核」，而 29 条规则里有 2 条明确标「AI智能审核？」。
           不新增就没有地方登记 AI 类规则；新增是改客户配置器的枚举，是客户的决定。
    - id: G-07
      item: 「共享审核」是否真分初审/复审两道
      why: 审批记录里节点名是同一个「共享审核」，但同一张单上连续出现两次不同审批人。
           拆或不拆决定报告给谁看、复核意见记在哪。
    - id: G-08
      item: 单据撤回重提后，AI 审核结论是否失效、是否重跑
      why: 实测 12 次撤回。结论沿用则可能基于旧附件，重跑则要定义以哪一版附件为准。
    - id: G-09
      item: 29 条规则表中「实现途径=？」的 3 条由谁执行
      why: 客户自己在表里就写的「？」。这 3 条都是补贴计发口径，金额影响直接。
    - id: G-10
      item: AI 审核报告对共享审核岗之外角色的可见性
      why: 实测 AI 审核不通过不阻断流程，人工仍需自行判断。报告给不给部门负责人、
           给不给提单人看，决定前端的权限模型。
