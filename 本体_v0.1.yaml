      name: 审批节点
      source: 审批意见
      values: [开始, 部门负责人, 经办部门分管领导, 综合部分管领导, 分管领导, 总经理, AI审核, 共享审核, 撤回, 流程结束]
      measured: {共享审核: 124, 开始: 84, 部门负责人: 49, 经办部门分管领导: 41,
                 撤回: 15, AI审核: 7, 综合部分管领导: 5, 总经理: 3, 分管领导: 2,
                 流程结束: 40, 审批行合计: 330}
      note: |
        **全部数自 50 页审批记录，而且这一版的数字是逐行对账出来的。**
        v0.1 初稿的计数（共享审核 97 / 开始 67 / …）是解析器漏了 24% 得到的：
        续页（不带单据编号、不带「申请人」表头的页）被错归到了**后一张**单，
        而后一张单的表头解析会把开头那些无标签的行整段吃掉，于是
        80 条审批记录凭空消失（330 → 255），**不报错、不抛异常**。
        发现它的唯一办法是独立数一遍 PDF 原文里「整行等于节点名」的次数当真值去对账。

        两处取值修正：
        · 加「总经理」（实测 3 次）与「分管领导」（实测 2 次）—— 初稿漏了「总经理」。
          TR-D4-06 要求「审批记录含分管领导 AND 含总经理」，少一个取值这条规则就判不准。
        · 删「审批人和报账人相同跳过」—— **它不是节点，是「部门负责人」那一行的审批意见**
          （审批人与报账人是同一人时系统自动跳过）。原文形状：
              2 / 部门负责人 / 1000504/吕雪娇 / 审批人和报账人相同跳过 / 2026-10-09 10:08:16
          把审批意见当成节点，流程本体就会多出一个不存在的节点。
        · 「流程结束」保留在枚举里，但它是**结束标记而非审批行**：单独一行，无序号、
          无审批人、无时间。实测 40 次 = 40 张单各一次。

