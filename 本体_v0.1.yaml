        153 个差旅场景按（大类编码 × 小类编码）去重后 **29 行**（附件口径原文去重
        25 种，差异多为空格/换行）。已落为 规则资产/必要附件决策表_v0.1.yaml，
        与源表 153 行逐行对账通过。
        **原实测警告（2026-10-18，已修正）：40 张样本的附件清单字段 100% 为空**
        （单人「发票文件」「事前附件」各 33 行全空、「1报销附件」表 33 行全空、
        多人「报销附件」表 7 行全空）——**归因错了**：附件其实是内嵌在 xlsx 里的
        PNG（`xl/media/`），不是没有，是轻解析读不到。2026-10-21 已由
        attachment_extract 抽出 219 张（覆盖全部 40 张单）；C1301（附件类型）
        2026-10-22 由 attachment_classify 读图判完（219/219，untyped=0），真实可得。
        C1302（文件名）从抽取时起就已知，仅未正式解除标注。见 G-29。
