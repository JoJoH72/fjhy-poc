# 福建海运集团 POC · 差旅费 AI 智能审核 · 本体 v0.1
#
# 四段：business（业务本体）/ rule_schema（规则本体八要素）/ glossary（术语映射）
#       / process（流程本体）
#
# 口径纪律（改动前必读）：
#   1. 每个概念都带 source，指向它在客户材料里的出处。没出处的概念不许进本体。
#      source 取值：
#        单据样本    —— 材料/单据明细表与审批意见/*.xlsx 的列名，客户系统现有字段
#        审批意见    —— 材料/单据明细表与审批意见/*审批意见.pdf，客户系统现有字段
#        审核要点    —— 材料/差旅审核制度规则/2.3 差旅费共享审核要点.pdf
#        规则清单    —— 材料/差旅审核制度规则/差旅费审核规则.xlsx（29 条）
#        场景表      —— 材料/差旅审核制度规则/财务共享业务场景核算及审核规则.xlsx
#        配置器      —— 材料/差旅审核制度规则/2.5 系统审核算法.xlsx
#        制度(OCR)   —— 4 份扫描制度 PDF 经 Tesseract OCR 取得，**数字待人工复核**
#        待业务侧明确 —— 材料里没有，需要客户给口径。不许自行推定
#   2. 标 `ocr: true` 的数值一律视为未经确认。OCR 把「闽港财智〔2025〕20号」
#      识别成「赣港财知2025] 20号」，数字同样可能错位——阈值错一位，
#      硬规则就从保护变成伤害。
#   3. process.rule_binding 按「实现途径」绑节点，依据是 29 条规则表的「实现途径」列，
#      不按猜测。实现途径=通过OA控制 的规则**不进本系统执行集**，只列候选。

meta:
  # 版本串统一成 0.1（原为 v0.1-draft）。理由：cycle_log.ontology_version、
  # release.ontology_version 都引用它，而其余资产（规则清单、决策表、标准表、
  # 敏感词表、内部单位名单）的 version 都是 0.1。两套写法并存会让
  # 「这条结论用的是哪版本体」在审计时对不上。
  # 「draft」这个信息没有丢，挪到下面的 maturity。
  version: "0.1"
  maturity: draft        # draft | reviewed | published；published 需业务侧签字
  date: 2026-10-18
  scenario: 单人/多人差旅费报账单
  entity: 福建省港口集团有限责任公司财智分公司（财务共享中心）
  scope_note: |
    场景范围经用户 2026-10-18 确认：只做「单人/多人差旅报销单」。
    招待费、会议费、日常费用报销等其余 11 类费用报账单不在本 POC 内。
  baseline_priority:
    - 制度PDF（闽港财智〔2025〕20号 等 5 份）
    - 2.3 差旅费共享审核要点.pdf
    - 财务共享业务场景核算及审核规则.xlsx
    - 差旅费审核规则.xlsx
  baseline_note: |
    上述优先级由用户 2026-10-18 确认。四份材料冲突时以靠前者为准，
    并在规则清单的 `conflict` 字段逐条记录裁决过程，不静默取一方。

# ═══════════════════════════════════════════════════════════════════
# 一、业务本体 —— 审什么
# ═══════════════════════════════════════════════════════════════════
business:

  entities:

    # ───────── 单据主体 ─────────
    - id: E01
      name: 报账单
      alias: [差旅费报账单, 多人差旅费报账单, 单据]
      source: 单据样本
      note: 共享系统的报账单主表。单人与多人共用本实体，以 is_multi_person 区分。
      concepts:
        - {id: C0101, name: 单据编号,     type: string,  source: 单据样本, example: "FJPG-BX2610132121"}
        - {id: C0102, name: 单据类型,     type: enum,    enum: EN01, source: 单据样本}
        - {id: C0103, name: 单据日期,     type: datetime, source: 单据样本}
        - {id: C0104, name: 提单人,       type: ref,     ref: E08, source: 单据样本}
        - {id: C0105, name: 报账人,       type: ref,     ref: E08, source: 单据样本,
           note: 多人差旅报账单无此列，报账人下沉到费用明细行的「部门」+ 出差人名单}
        - {id: C0106, name: 报账部门,     type: string,  source: 单据样本}
        - {id: C0107, name: 核算主体,     type: ref,     ref: E09, source: 单据样本,
           alias: [报账人公司], note: 明细表列名为「报账人公司」，审批意见页签名为「核算主体」，同一概念}
        - {id: C0108, name: 单据状态,     type: enum,    enum: EN02, source: 单据样本}
        - {id: C0109, name: 费用承担部门, type: string,  source: 单据样本}
        - {id: C0110, name: 业务类型,     type: enum,    enum: EN03, source: 单据样本, alias: [业务大类]}
        - {id: C0111, name: 报账金额,     type: money,   source: 单据样本}
        - {id: C0112, name: 付款金额,     type: money,   source: 单据样本}
        - {id: C0113, name: 币种,         type: string,  source: 单据样本}
        - {id: C0114, name: 税金,         type: money,   source: 单据样本}
        - {id: C0115, name: 摘要,         type: text,    source: 单据样本, alias: [事由]}
        - {id: C0116, name: 补充说明,     type: text,    source: 审批意见,
           note: 多条规则的例外出口都落在这里（超标准、无住宿发票、往返衔接不一致…），
                 是软规则「说明是否充分」的唯一输入}
        - {id: C0117, name: 附件张数,     type: int,     source: 审批意见}
        - {id: C0118, name: 凭证编号,     type: string,  source: 审批意见}
        - {id: C0119, name: 入账期间,     type: string,  source: 审批意见}
        - {id: C0120, name: 商旅结算,     type: money,   source: 审批意见}
        - {id: C0121, name: 核销金额,     type: money,   source: 审批意见}
        - {id: C0122, name: 挂账及付款金额, type: money,  source: 审批意见}
        - {id: C0123, name: 收款方,       type: string,  source: 审批意见, sensitive: true}
        - {id: C0124, name: 收款账号,     type: string,  source: 审批意见, sensitive: true,
           note: 真实银行账号。**任何对外出口都必须掩码**，含审计接口、调试查询、
                 错误信息与导出文件。见 服务端/mask.py}
        - {id: C0125, name: 收款银行,     type: string,  source: 审批意见, sensitive: true}
        - {id: C0126, name: 支付方式,     type: string,  source: 审批意见}
        - {id: C0127, name: 付款用途,     type: text,    source: 审批意见}
        - {id: C0128, name: 是否多人,     type: bool,    source: 单据样本, derived: C0102}
        # 下面两个字段是解析审批意见 PDF 之后补的。它们**不是 E03 出差审批单的字段**：
        # 出行人员记在报账单的审批意见页上，而 C0301「出差人名单」是 OA 出差审批单上的
        # 字段。两者看着像，但一个是「这张单报了谁的费用」、一个是「审批单批了谁出差」——
        # TR-D2-03 要比的正是这两者是否一致；混成一个概念，那条规则就变成自己和自己比，
        # 永远通过。
        - {id: C0129, name: 出行人员, type: ref, ref: E08, source: 审批意见,
           note: "格式「姓名(工号),姓名(工号)」。实测 7 张多人单都有；单人单没有这一栏（出行人就是报账人）。多人单的人数由它数出来，比用分摊部门去重更准。"}
        - {id: C0130, name: 标准依据人, type: string, source: 审批意见,
           note: "多人单上注明按谁的标准执行。多人同行时住宿标准按哪个人的职级算，靠它。实测 7 张多人单都有。"}

    - id: E02
      name: 费用明细
      source: 单据样本
      note: 报账单的费用明细行。单人表 3 列（单据号/费用明细/金额），
            多人表 4 列（多一列「部门」）——多人单按部门分摊，这是两表唯一结构差异。
      concepts:
        - {id: C0201, name: 单据号,       type: ref, ref: E01, source: 单据样本}
        - {id: C0202, name: 费用小类,     type: enum, enum: EN04, source: 单据样本, alias: [费用明细]}
        - {id: C0203, name: 费用明细金额, type: money, source: 单据样本}
        - {id: C0204, name: 分摊部门,     type: string, source: 单据样本,
           note: 仅多人差旅报账单有；单人单此字段为空}

    # ───────── 出差事实 ─────────
    - id: E03
      name: 出差审批单
      alias: [出差申请单, 关联审批单, OA审批单]
      source: 审核要点
      note: |
        在 OA 系统中产生，由 OA 同步给共享系统。29 条规则表第 2 条明确：
        「可以强控是否有关联审批单，但是没法识别 OA 审批单里面的内容」——
        所以本实体的字段分两档：synced=true 的字段共享系统能读到，
        synced=unknown 的字段**是否同步未定，待业务侧明确**。
        这个边界决定了一半规则能不能落地，不许想当然。
      concepts:
        - {id: C0301, name: 出差人名单,   type: ref,  ref: E08, source: 审核要点, synced: unknown}
        - {id: C0302, name: 出差起始日期, type: date, source: 审核要点, synced: unknown,
           note: 29 条表第 20~23 条的评估列写「OA将出差时间和出差地点同步给共享系统，可以实现」
                 ——是「将」（未来时），不是「已」。按未同步处理，待业务侧确认}
        - {id: C0303, name: 出差结束日期, type: date, source: 审核要点, synced: unknown}
        - {id: C0304, name: 出差地点,     type: string, source: 审核要点, synced: unknown,
           note: 审核要点 2.1.5 要求「至少写到市级」，省级不接受}
        - {id: C0305, name: 出差天数,     type: int,  source: 审核要点, synced: unknown}
        - {id: C0306, name: 出差人数,     type: int,  source: 审核要点, synced: unknown}
        - {id: C0307, name: 审批日期,     type: date, source: 审核要点, synced: unknown,
           note: 2.1.6「审批日期不得晚于出差起始日期」}
        - {id: C0308, name: 回填日期,     type: date, source: 审核要点, synced: unknown,
           note: 2.1.6「回填日期不得早于出差结束日期」}
        - {id: C0309, name: 用餐情况,     type: enum, enum: EN05, source: 审核要点, synced: unknown}
        - {id: C0310, name: 用车情况,     type: enum, enum: EN06, source: 审核要点, synced: unknown}
        - {id: C0311, name: 出差事由,     type: text, source: 审核要点, synced: unknown}
        - {id: C0312, name: 审批形式,     type: enum, enum: EN07, source: 审核要点, synced: unknown,
           note: 2.1.6 纸质线下审批需全体出差人员手写签名 + 回来后日期}

    - id: E04
      name: 出差日历
      source: 审核要点
      note: 共享提单界面的「出差日历」区，逐日勾选地点与用餐用车。
            29 条表第 19 条、审核要点 2.1.5 都以它为校验基准。这是共享系统内的数据，不是 OA 的。
      concepts:
        - {id: C0401, name: 日期,     type: date,   source: 审核要点}
        - {id: C0402, name: 地点,     type: string, source: 审核要点}
        - {id: C0403, name: 是否用餐, type: bool,   source: 审核要点}
        - {id: C0404, name: 是否用车, type: bool,   source: 审核要点}
        - {id: C0405, name: 用餐栏次, type: enum,   enum: EN08, source: 审核要点,
           note: 2.1.12「若为下午出差…早、中栏次可不做勾选要求」}

    # ───────── 票据 ─────────
    - id: E05
      name: 发票
      source: 规则清单
      note: 所有票据的父实体。住宿费发票与交通费凭证各有专属字段，见 E06/E07。
      concepts:
        - {id: C0501, name: 发票类型,   type: enum,  enum: EN09, source: 规则清单}
        - {id: C0502, name: 发票号码,   type: string, source: 规则清单}
        - {id: C0503, name: 开票日期,   type: date,  source: 规则清单}
        - {id: C0504, name: 开票单位,   type: string, source: 规则清单, alias: [销售方],
           note: 29 条表第 3 条：开票单位不能含 KTV、SPA 等娱乐场所与旅游景点}
        - {id: C0505, name: 发票抬头,   type: string, source: 规则清单, alias: [购买方],
           note: 29 条表第 7 条：住宿费发票抬头应为核算主体}
        - {id: C0506, name: 价税合计,   type: money, source: 规则清单}
        - {id: C0507, name: 税额,       type: money, source: 规则清单}
        - {id: C0508, name: 税率,       type: rate,  source: 规则清单}
        - {id: C0509, name: 发票明细,   type: text,  source: 规则清单,
           note: 29 条表第 4 条：明细不能含「洗浴」等敏感词}
        - {id: C0510, name: 备注栏,     type: text,  source: 审核要点,
           note: 多条规则的例外出口：住宿日期（2.1.x）、接待日期、大巴车姓名身份证号}
        - {id: C0511, name: 红冲状态,   type: enum,  enum: EN10, source: 规则清单,
           note: 29 条表第 29 条：发票已红冲的提醒退回}
        - {id: C0512, name: 是否数电票, type: bool,  source: 审核要点,
           note: 2.1.16：退票手续费需取得数电专票方可抵扣}

    - id: E06
      name: 住宿费发票
      parent: E05
      source: 审核要点
      concepts:
        - {id: C0601, name: 入住时间, type: date, source: 审核要点,
           note: 2.3.1 福州港务特殊规则：住宿发票需注明入住时间、离店时间、人员姓名，按人员分别开具}
        - {id: C0602, name: 离店时间, type: date, source: 审核要点}
        - {id: C0603, name: 入住人姓名, type: string, source: 审核要点, sensitive: true}
        - {id: C0604, name: 住宿天数, type: int, source: 审核要点,
           note: 2.3.1 东南守押特殊规则：需列明住宿天数、间数}
        - {id: C0605, name: 住宿间数, type: int, source: 审核要点}
        - {id: C0606, name: 是否午休房, type: bool, source: 制度,
           note: 闽财行〔2023〕12号 解答3：午休房按限额标准 50% 以内凭据报销}

    - id: E07
      name: 交通费凭证
      parent: E05
      source: 审核要点
      concepts:
        - {id: C0701, name: 交通工具, type: enum, enum: EN11, source: 审核要点}
        - {id: C0702, name: 坐席等级, type: string, source: 规则清单,
           note: 29 条表第 5 条：按各单位制度校验坐席等级}
        - {id: C0703, name: 出发地,   type: string, source: 审核要点}
        - {id: C0704, name: 到达地,   type: string, source: 审核要点}
        - {id: C0705, name: 乘车日期, type: date, source: 审核要点,
           note: 2.1.16：乘车日期在 2025-09-30 后的纸质铁路票不可报销入账}
        - {id: C0706, name: 是否含往返, type: bool, source: 审核要点,
           note: 2.1.4「交通费报销凭证需包含往返行程」；2.2.1 外派差旅费**取消**该要求}
        - {id: C0707, name: 退票手续费, type: money, source: 审核要点}
        - {id: C0708, name: 大巴票备注身份信息, type: bool, source: 规则清单,
           note: 29 条表第 11 条：大巴车票发票备注姓名、身份证号码的可抵扣进项税}

    # ───────── 主体与标准 ─────────
    - id: E08
      name: 出差人
      source: 单据样本
      concepts:
        - {id: C0801, name: 工号,     type: string, source: 审批意见, sensitive: true}
        - {id: C0802, name: 姓名,     type: string, source: 单据样本, sensitive: true}
        - {id: C0803, name: 所属部门, type: string, source: 单据样本}
        - {id: C0804, name: 职级,     type: enum,  enum: EN12, source: 审批意见,
           note: "**可得性一度被低估。** 这个字段就在审批意见页的「申请人」栏里，格式「姓名/职级/部门」，40 张单全都有。v0.1 初稿把 source 标成「制度」、可得性标成「待业务侧明确」，于是「职级 → 住宿费标准档位」这条链被当成断的，TR-D4-02 只能做区间判定。实测取值 4 档：其他员工 31 / 总经理 5 / 部门负责人 3 / 副总经理 1。"}
        - {id: C0805, name: 常驻地,   type: string, source: 制度,
           note: 闽财行〔2023〕12号 解答19：常驻地指单位所在的市区（设区市）或县（市）域范围。
                 2.3.1 漳州港务/泉州港务/闽运有各自的常驻地界定，优先于通用口径}
        - {id: C0806, name: 所属单位, type: ref, ref: E09, source: 单据样本}
        - {id: C0807, name: 是否配备公务用车, type: bool, source: 审核要点,
           note: 2.1.18：已配备公务用车的权属企业负责人不得重复领取公务交通补贴}

    - id: E09
      name: 核算主体
      source: 单据样本
      concepts:
        - {id: C0901, name: 单位名称,   type: string, source: 单据样本}
        - {id: C0902, name: 直管企业,   type: enum, enum: EN13, source: 审核要点}
        - {id: C0903, name: 所属行业,   type: enum, enum: EN14, source: 场景表,
           note: 场景表有 5 个行业分表（海运/陆运/工程施工/代理/物资商业）。
                 本 POC 主体为海运集团，海运行业分表 48 行中**无差旅场景**，
                 差旅口径一律走「业务域」总表}
        - {id: C0904, name: 付款主体,   type: string, source: 规则清单,
           note: 29 条表第 1 条：付款主体需与核算主体完全一致}

    - id: E10
      name: 标准表
      source: 制度
      ocr: true
      note: |
        **本实体全部数值来自扫描制度 PDF 的 OCR，一律标「待人工复核」，
        不进硬规则阈值。** 已 OCR 到的条款见 规则资产/标准表_v0.1.yaml。
        阈值错一位，硬规则就从保护变成伤害——宁可判「待人工」，不可错判。
      concepts:
