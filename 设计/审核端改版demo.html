<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>差旅费智能审核平台</title>
<style>
/* ── 令牌 ─────────────────────────────────────────── */
:root{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel-2:#FAFBFD;
  --ink:#1B2532; --ink-2:#5B6675; --ink-3:#8A94A3;
  --line:#E4E9F0; --line-2:#EEF2F7;
  --brand:#0E4DA4; --brand-hi:#1560C8; --brand-bg:#EEF4FC; --brand-line:#C9DBF4;
  --gold:#B9912F; --gold-bg:#FAF3E1;
  --ok:#1E7E4E; --ok-bg:#E9F5EE;
  --bad:#C0351F; --bad-bg:#FBECE8;
  --warn:#8A6410; --warn-bg:#FBF3DC;
  --r-s:6px; --r-m:10px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 10px 30px rgba(16,24,40,.16);
  --ring:0 0 0 3px rgba(14,77,164,.22);
  /* 图表 categorical（已过验证器 light 全绿，gold 对比度 WARN→用直接标注补偿） */
  --c1:#0E4DA4; --c2:#1E7E4E; --c3:#B9912F; --c4:#C0351F;
}
[data-theme=dark]{
  --bg:#0F141B; --panel:#151C26; --panel-2:#1A2230;
  --ink:#E6EBF2; --ink-2:#9AA6B5; --ink-3:#66717F;
  --line:#26303C; --line-2:#1E2836;
  --brand:#5B9BE8; --brand-hi:#7CB2F0; --brand-bg:#17253C; --brand-line:#2C4368;
  --gold:#D2AC55; --gold-bg:#2B2412;
  --ok:#4CB982; --ok-bg:#122A1E;
  --bad:#E8705A; --bad-bg:#361912;
  --warn:#D9B25C; --warn-bg:#2F2714;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lg:0 10px 30px rgba(0,0,0,.5);
  --ring:0 0 0 3px rgba(91,155,232,.3);
  /* dark 组（四项全 PASS） */
  --c1:#4C86D9; --c2:#2FA98B; --c3:#B08D26; --c4:#E85D82;
}
/* ── 基座 ─────────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;box-shadow:var(--ring);border-color:var(--brand)}
.num{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ── 登录页 ──────────────────────────────────────── */
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:
  radial-gradient(1200px 500px at 20% -10%, var(--brand-bg), transparent 60%), var(--bg)}
.login.show{display:flex}
.login-card{width:400px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:36px 36px 28px}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.login-brand .mark{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-hi));display:grid;place-items:center;color:#fff}
.login-brand h1{font-size:17px}
.login-brand .sub{font-size:12px;color:var(--ink-3)}
.login-card label{display:block;font-size:13px;color:var(--ink-2);margin:12px 0 6px}
.login-card .input{width:100%;height:38px}
.pwd-wrap{position:relative}
.pwd-wrap .input{padding-right:40px;width:100%}
.pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:4px;display:grid;place-items:center;color:var(--ink-3)}
.pwd-eye:hover{background:var(--line-2);color:var(--ink-2)}
.login-roles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.role-pick{border:1px solid var(--line);border-radius:var(--r-s);padding:8px 4px;text-align:center;font-size:12px;color:var(--ink-2);background:var(--panel)}
.role-pick.on{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);font-weight:600}
.role-pick .ic{display:block;margin:0 auto 4px;width:22px;height:22px;color:currentColor}
.login-note{font-size:12px;color:var(--ink-3);margin-top:12px;text-align:center}
.login-btn{width:100%;height:40px;margin-top:16px;font-size:14px}

/* ── 外壳 ─────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden}
.app.hidden{display:none}
.side{width:216px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 16px}
.brand-mark{width:36px;height:36px;flex:none;border-radius:var(--r-s);background:linear-gradient(135deg,var(--brand),var(--brand-hi));display:grid;place-items:center;color:#fff}
.brand-name{font-size:14px;font-weight:600;line-height:1.3}
.brand-sub{font-size:12px;color:var(--ink-3)}
.nav{padding:8px;flex:1;overflow:auto}
.nav-group{font-size:12px;color:var(--ink-3);padding:12px 8px 4px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 12px;border-radius:var(--r-s);color:var(--ink-2);position:relative}
.nav-item svg{flex:none}
.nav-item:hover{background:var(--line-2);color:var(--ink)}
.nav-item.on{background:var(--brand-bg);color:var(--brand);font-weight:600}
.nav-item.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand)}
.nav-sub{padding-left:20px}
.nav-item .ro{margin-left:auto;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:0 5px;line-height:16px}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.avatar{width:30px;height:30px;border-radius:50%;flex:none;background:var(--brand-bg);color:var(--brand);display:grid;place-items:center;font-size:13px;font-weight:600}
.side-user .who{font-size:13px}
.side-user .role{font-size:12px;color:var(--ink-3)}
.side-user .out{margin-left:auto;color:var(--ink-3);font-size:12px;padding:4px 8px;border-radius:4px}
.side-user .out:hover{background:var(--line-2);color:var(--bad)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{flex:none;height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}
.topbar h1{font-size:16px;font-weight:600}
.topbar .grow{flex:1}
.data-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);padding:4px 12px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.data-pill i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.content{flex:1;overflow:auto;padding:24px 24px 48px}

/* ── 通用件 ───────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line-2)}
.card-head h2{font-size:15px;font-weight:600}
.card-head .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 16px;border-radius:var(--r-s);font-size:13px;border:1px solid transparent;transition:background .15s,border-color .15s,color .15s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-hi)}
.btn.ghost{border-color:var(--line);color:var(--ink-2);background:var(--panel)}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn.danger{border-color:var(--line);color:var(--bad);background:var(--panel)}
.btn.danger:hover{border-color:var(--bad)}
.btn.pass{background:var(--ok);color:#fff}
.btn.pass:hover{filter:brightness(1.1)}
.btn.reject{background:var(--bad);color:#fff}
.btn.reject:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.lg{height:36px;padding:0 20px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}
.pill.bad{color:var(--bad);background:var(--bad-bg)}
.pill.warn{color:var(--warn);background:var(--warn-bg)}
.pill.brand{color:var(--brand);background:var(--brand-bg)}
.tag-demo{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;color:var(--gold);background:var(--gold-bg);border:1px solid var(--gold);margin-left:6px;vertical-align:1px}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r-s);padding:2px}
.seg button{padding:4px 12px;font-size:13px;color:var(--ink-2);border-radius:4px}
.seg button.on{background:var(--panel);color:var(--brand);font-weight:600;box-shadow:var(--shadow)}
.input,.select{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel);font-size:13px;color:var(--ink)}
.input::placeholder{color:var(--ink-3)}

/* ── 统计卡 ─────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:16px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--brand-line)}
.stat .k{font-size:12px;color:var(--ink-2)}
.stat .v{font-size:26px;font-weight:600;margin:2px 0;line-height:1.2}
.stat .v small{font-size:13px;font-weight:400;color:var(--ink-3)}
.stat .d{font-size:12px;color:var(--ink-3)}
.stat.alert::before{background:var(--gold)}
.stat.alert .v{color:var(--brand)}

/* ── 表格 ───────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--ink-3);font-size:12px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:var(--panel-2)}
.tbl .c{width:36px;text-align:center}
.tbl .amt{text-align:right;white-space:nowrap}
.tbl a{color:var(--brand);text-decoration:none}
.tbl a:hover{text-decoration:underline}
.rowcheck{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.empty-row td{text-align:center;color:var(--ink-3);padding:32px 0}
.batchbar{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:10px 12px 10px 20px;border-radius:var(--r-m);box-shadow:var(--shadow-lg);transition:transform .2s ease,opacity .2s ease;opacity:0;z-index:30}
[data-theme=dark] .batchbar{background:#26313F;border:1px solid var(--line)}
.batchbar.show{transform:translate(-50%,0);opacity:1}
.batchbar .cnt{font-size:13px}
.batchbar .cnt b{color:#FFD98A;margin:0 2px}
.batchbar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.3);height:30px}
.batchbar .btn:hover{border-color:#fff}
.batchbar .btn.primary{background:var(--brand-hi);border-color:transparent}

/* ── 图表 ───────────────────────────────────────── */
.chart-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;margin-bottom:16px}
.hbar{display:grid;grid-template-columns:88px 1fr 64px;align-items:center;gap:10px;font-size:13px;padding:5px 0}
.hbar .lb{color:var(--ink-2);text-align:right;white-space:nowrap}
.hbar .track{height:14px;background:var(--panel-2);border-radius:3px;overflow:hidden;display:flex}
.hbar .track i{display:block;height:100%}
.hbar .val{color:var(--ink-2);white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.ring-wrap{display:flex;align-items:center;gap:20px;justify-content:center;padding:8px 0}
.ring-legend{font-size:13px}
.ring-legend div{display:flex;align-items:center;gap:8px;padding:4px 0}
.ring-legend i{width:10px;height:10px;border-radius:2px}
.funnel{padding:6px 0}
.funnel .fr{display:grid;grid-template-columns:96px 1fr 92px;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.funnel .fl{color:var(--ink-2);text-align:right;white-space:nowrap}
.funnel .ft{height:18px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.funnel .ft i{display:block;height:100%;background:var(--c1);border-radius:3px 0 0 3px}
.funnel .fv{color:var(--ink-2)}

/* ── 报告页 ──────────────────────────────────────── */
.gate{display:flex;gap:20px;align-items:stretch;background:var(--brand-bg);border:1px solid var(--brand-line);border-left:3px solid var(--brand);border-radius:var(--r-m);padding:20px 24px;margin-bottom:16px}
.gate .info{flex:1;min-width:0}
.gate .bill-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.gate .bill-line b{font-size:15px}
.gate .meta{font-size:13px;color:var(--ink-2);display:flex;gap:16px;flex-wrap:wrap}
.gate .meta span{white-space:nowrap}
.gate .ai-line{margin-top:12px;font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.gate .note{font-size:12px;color:var(--ink-3);margin-top:4px}
.gate .ops{flex:none;display:grid;grid-template-columns:132px 132px;gap:8px;align-content:center}
.gate .ops .btn.lg{width:auto}
.gate .field{margin-top:12px;display:flex;gap:8px;max-width:520px}
.gate .field input{flex:1}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-bottom:16px}
.kv div{padding:10px 20px;border-right:1px solid var(--line-2)}
.kv div:nth-child(4n){border-right:0}
.kv dt{font-size:12px;color:var(--ink-3)}
.kv dd{font-size:13px;margin-top:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 12px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:var(--panel)}
.chip.on{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);font-weight:600}
.rule-row{cursor:pointer}
.rule-row .chev{transition:transform .15s;color:var(--ink-3)}
.rule-row.open .chev{transform:rotate(180deg)}
.ev-row td{background:var(--panel-2);padding:16px 20px 20px}
.ev-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:24px}
.ev-grid h4{font-size:12px;color:var(--ink-3);font-weight:500;margin-bottom:8px}
.ev dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:13px}
.ev dt{color:var(--ink-3)}
.quote{font-size:12px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px}
.atts{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:16px 20px 20px}
.att{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;background:var(--panel)}
.att .thumb{aspect-ratio:4/3;display:grid;place-items:center;color:var(--ink-3);background:linear-gradient(135deg,var(--panel-2),var(--brand-bg))}
.att .meta{padding:8px 12px;display:flex;align-items:center;gap:8px}
.att .meta .n{font-size:12px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .meta .t{font-size:11px;color:var(--brand);white-space:nowrap}

/* ── 追溯页 ──────────────────────────────────────── */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.step{border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);padding:12px 16px;position:relative;box-shadow:var(--shadow)}
.step .s-tag{font-size:12px;font-weight:600;color:var(--brand)}
.step .s-name{font-size:13px;margin:2px 0 6px}
.step .s-ms{font-size:20px;font-weight:600}
.step .s-tbl{font-size:12px;color:var(--ink-3);margin-top:2px}
.step::after{content:"";position:absolute;right:-9px;top:50%;width:8px;height:8px;border-top:1.5px solid var(--ink-3);border-right:1.5px solid var(--ink-3);transform:translateY(-50%) rotate(45deg)}
.step:last-child::after{display:none}

/* ── 管理页（知识资产/系统）──────────────────────── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plain-list{padding:8px 0}
.plain-row{display:flex;align-items:center;gap:12px;padding:10px 20px;border-bottom:1px solid var(--line-2);font-size:13px}
.plain-row:last-child{border-bottom:0}
.plain-row .grow{flex:1;min-width:0}
.plain-row .t{color:var(--ink-3);font-size:12px;white-space:nowrap}
/* ── 智能体架构图 ─────────────────────────────── */
.arch{padding:20px 20px 8px}
.lane{display:grid;grid-template-columns:72px 1fr;gap:16px;align-items:stretch}
.lane-head{
  border-right:2px solid var(--brand-line);display:flex;align-items:center;justify-content:center;
}
.lane-head .lt{font-size:20px;font-weight:700;color:var(--brand);letter-spacing:1px}
.lane-body{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:12px;padding:4px 0}
.node{
  position:relative;border:1px solid var(--line);border-radius:var(--r-s);
  background:var(--panel);padding:12px 12px 10px;cursor:pointer;text-align:left;
  transition:border-color .15s, box-shadow .15s;min-width:0;
}
.node:hover{border-color:var(--brand)}
.node.on{border-color:var(--brand);box-shadow:var(--ring)}
.node .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.node .chain{font-size:10px;color:var(--brand);background:var(--brand-bg);border-radius:3px;padding:0 5px;line-height:15px;white-space:nowrap}
.node .chain.k2{color:var(--gold);background:var(--gold-bg)}
.node .dot{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
.node .dot.run{background:var(--ok);animation:pulse 2s ease-out infinite}
.node .dot.idle{background:var(--ink-3)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,126,78,.45)}70%{box-shadow:0 0 0 7px rgba(30,126,78,0)}100%{box-shadow:0 0 0 0 rgba(30,126,78,0)}}
[data-theme=dark] .node .dot.run{background:var(--ok)}
.node .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .ds{font-size:11px;color:var(--ink-3);margin-top:3px;line-height:1.45}
.node .io{display:flex;gap:10px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-2);font-size:11px;color:var(--ink-3)}
.node .io b{color:var(--ink-2);font-weight:600}
.flow{
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:6px 0 6px 88px;color:var(--ink-3);font-size:11px;
}
.flow .wire{width:1.5px;height:18px;background:linear-gradient(var(--brand-line),var(--brand));position:relative;margin:0 24px}
.flow .wire::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);border:4px solid transparent;border-top:5px solid var(--brand)}
.flow .sig{border:1px dashed var(--brand-line);border-radius:999px;padding:1px 10px;color:var(--brand);background:var(--brand-bg)}
/* 节点详情浮层：贴节点弹出 */
.pop{
  position:fixed;z-index:35;width:360px;background:var(--panel);
  border:1px solid var(--brand-line);border-radius:var(--r-m);box-shadow:var(--shadow-lg);
  animation:popin .14s ease-out;
}
@keyframes popin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.pop .p-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.pop .p-head b{font-size:14px}
.pop .p-head .x{margin-left:auto;color:var(--ink-3);width:24px;height:24px;border-radius:4px;display:grid;place-items:center}
.pop .p-head .x:hover{background:var(--line-2);color:var(--ink)}
.pop table td{border-bottom:1px solid var(--line-2);font-size:12.5px}
.pop table td:first-child{color:var(--ink-3);width:84px}
.pop .p-foot{padding:8px 16px 12px;font-size:11px;color:var(--ink-3)}

/* ── 大模型配置 ─────────────────────────────────── */
.llm-uses{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.use{padding:16px 20px;display:flex;flex-direction:column}
.use .u-top{display:flex;align-items:center;gap:8px}
.use .u-name{font-size:15px;font-weight:600}
.use .u-model{font-size:17px;font-weight:600;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.use .u-vendor{font-size:12px;color:var(--ink-3)}
.use .u-desc{font-size:12px;color:var(--ink-2);margin:8px 0 12px;flex:1}
.use .u-ops{display:flex;gap:8px}
.use.add{border-style:dashed;background:transparent;box-shadow:none;justify-content:center}
.llm-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.trend{display:flex;align-items:flex-end;gap:4px;height:120px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;position:relative;min-width:0}
.day i{width:100%;max-width:16px;border-radius:2px 2px 0 0;display:block}
.day i.o{background:var(--ok)}
.day i.f{background:var(--bad)}
.day .dl{font-size:9px;color:var(--ink-3);height:12px;line-height:12px;visibility:hidden}
.day:nth-child(1) .dl,.day:nth-last-child(2) .dl,.day:last-child .dl{visibility:visible}
.day .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11px;padding:4px 10px;border-radius:6px;white-space:nowrap;z-index:5}
[data-theme=dark] .day .tip{background:#33404F}
.day:hover .tip{display:block}

/* ── 运行面板（AI 审核·参照部署流水线）────────── */
.runpanel{border:1px solid var(--brand-line);border-radius:var(--r-m);background:var(--brand-bg);padding:20px 24px;margin-bottom:16px}
.runpanel.done{border-color:var(--line);background:var(--panel)}
.runpanel.idle{background:var(--panel)}
.run-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.run-head .rt{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.run-head .spin{width:15px;height:15px;border:2px solid var(--brand-line);border-top-color:var(--brand);border-radius:50%;animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
.run-head .el{font-size:13px;color:var(--ink-2)}
.runbar{height:6px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-bottom:16px}
.runbar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .4s ease}
.runsteps{list-style:none}
.rs{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:13.5px;color:var(--ink-3)}
.rs .ic{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:50%}
.rs.done{color:var(--ink)}
.rs.done .ic{background:var(--ok-bg);color:var(--ok)}
.rs.run{color:var(--ink);font-weight:500}
.rs.run .ic{border:2px solid var(--brand-line);border-top-color:var(--brand);border-radius:50%;width:14px;height:14px;animation:rot .8s linear infinite}
.rs .t{margin-left:auto;color:var(--ink-3);font-size:12px}
.res-row{display:flex;gap:12px;margin-top:4px}
.res{flex:1;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px;background:var(--panel)}
.res b{font-size:22px;margin-right:8px}
.res.ok b{color:var(--ok)}.res.warn b{color:var(--warn)}.res.bad b{color:var(--bad)}

/* ── 堆叠条 / 环形 ─────────────────────────────── */
.stack-row{display:grid;grid-template-columns:64px 1fr 110px;align-items:center;gap:12px;padding:8px 0;font-size:13px}
.stack-lb{color:var(--ink-2);text-align:right}
.stack-track{display:flex;height:16px;border-radius:4px;overflow:hidden;gap:2px}
.stack-track i{display:block;height:100%;min-width:0}
.stack-note{color:var(--ink-3);font-size:12px}
.donut-wrap{display:flex;align-items:center;gap:24px;padding:12px 20px}
.donut{width:104px;height:104px;border-radius:50%;position:relative;flex:none}
.donut::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--panel)}
.donut .c{position:absolute;inset:0;display:grid;place-items:center;z-index:1;text-align:center}
.donut .c b{font-size:20px;display:block;line-height:1.1}
.donut .c span{font-size:10px;color:var(--ink-3)}

/* ── 竖向时间线（审计·参照流水线日志）────────── */
.tl{padding:20px 24px 4px}
.tl-item{display:grid;grid-template-columns:24px 1fr;gap:0 16px;position:relative;padding-bottom:24px}
.tl-item::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:1.5px;background:var(--line)}
.tl-item:last-child{padding-bottom:8px}
.tl-item:last-child::before{display:none}
.tl-dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--panel);position:relative;z-index:1}
.tl-item.done .tl-dot{border-color:var(--ok);background:var(--ok-bg)}
.tl-item.wait .tl-dot{border-style:dashed}
.tl-body .l1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tl-body .l1 b{font-size:14px}
.tl-body .l1 .ms{font-weight:600}
.tl-body .l1 .tm{color:var(--ink-3);font-size:12px;margin-left:auto}
.tl-body .desc{font-size:13px;color:var(--ink-2);margin:4px 0 4px;max-width:640px}
.tl-body .tag{font-size:11px;color:var(--brand);background:var(--brand-bg);border-radius:4px;padding:1px 8px;display:inline-block}

/* ── 八步步骤器（本体工场）────────────────────── */
.steps8{display:grid;grid-template-columns:repeat(8,1fr);padding:24px 20px 8px}
.st8{position:relative;text-align:center;padding:0 4px}
.st8::before{content:"";position:absolute;top:14px;left:calc(-50% + 14px);right:calc(50% + 14px);height:2px;background:var(--line)}
.st8:first-child::before{display:none}
.st8.done::before{background:var(--brand)}
.st8 .n{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--panel);color:var(--ink-3);display:grid;place-items:center;margin:0 auto 8px;font-size:12px;position:relative;z-index:1}
.st8.done .n{border-color:var(--brand);background:var(--brand);color:#fff}
.st8.cur .n{border-color:var(--brand);color:var(--brand);box-shadow:var(--ring)}
.st8 .nm{font-size:12px;color:var(--ink-2)}
.st8.done .nm{color:var(--ink);font-weight:500}
.st8.cur .nm{color:var(--brand);font-weight:600}

/* ── 抽取流水线 / 文件卡 / 自检章 ─────────────── */
.pipe{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr 28px 1fr;align-items:stretch;padding:20px}
.pstep{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px;background:var(--panel)}
.pstep.hot{border-color:var(--brand-line);background:var(--brand-bg)}
.parrow{display:grid;place-items:center;color:var(--ink-3)}
.pstep .pn{font-size:13px;font-weight:600}
.pstep .pd{font-size:12px;color:var(--ink-3);margin-top:4px;min-height:34px}
.pstep .pv{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line-2);font-size:12px;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.pstep .pv b{color:var(--ink);font-weight:600}
.dropzone{border:1.5px dashed var(--line);border-radius:var(--r-m);display:grid;place-items:center;padding:24px;color:var(--ink-3);cursor:pointer;transition:border-color .15s,color .15s;margin:16px 20px 4px}
.dropzone:hover{border-color:var(--brand);color:var(--brand)}
.dz-ic{display:block;margin:0 auto 8px}
.filegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:16px 20px 20px}
.fcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:var(--r-s);padding:12px 12px;background:var(--panel);align-items:flex-start}
.ftype{width:36px;height:36px;border-radius:6px;flex:none;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}
.ftype.pdf{background:#C0351F}.ftype.xlsx{background:#1E7E4E}
[data-theme=dark] .ftype.pdf{background:#8A3A2C}
[data-theme=dark] .ftype.xlsx{background:#2C5A42}
.fcard .fn{font-size:13px;line-height:1.45;flex:1;min-width:0}
.fcard .fm{font-size:11px;color:var(--ink-3);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.cihero{display:flex;align-items:center;gap:12px;padding:20px 24px}
.cihero .b{width:40px;height:40px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;flex:none}

/* 复核队列标签：选中=品牌色（Ant Design selected 模式），语义只上角标数字 */
.qtab{display:inline-flex;align-items:center;gap:6px;flex:none;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:12px;cursor:pointer;transition:border-color .15s,background .15s,color .15s}
.qtab:hover{border-color:var(--brand-line);color:var(--ink)}
.qtab.cur{border-color:var(--brand);color:var(--brand);background:var(--brand-bg);font-weight:600}
.qtab.cur::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--brand)}
.qtab b{font-weight:600;color:var(--bad)}
.qtab:not(.on) b{color:var(--warn)}
/* ── 偏差与回流：四象限 + 成因卡 ─────────────── */
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:16px}
.qcard{position:relative;border:1px solid var(--line);border-radius:var(--r-m);background:var(--panel);box-shadow:var(--shadow);padding:16px 20px;overflow:hidden}
.qcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.qcard.ok::before{background:var(--ok)} .qcard.bad::before{background:var(--bad)} .qcard.warn::before{background:var(--warn)}
.qcard .q-pos{font-size:11px;color:var(--ink-3);white-space:nowrap}
.qcard .q-v{font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 0}
.qcard .q-v small{font-size:13px;font-weight:400;color:var(--ink-3)}
.qcard .q-n{font-size:14px;font-weight:600;margin-top:2px}
.qcard .q-d{font-size:11.5px;color:var(--ink-3);margin-top:4px;line-height:1.5}
.qcard .q-zero{position:absolute;right:12px;top:12px;font-size:10px;color:var(--ok);border:1px solid var(--ok);border-radius:4px;padding:0 5px;line-height:15px}
.cause{padding:12px 0;border-bottom:1px solid var(--line-2)}
.cause:last-child{border-bottom:0}
.cause .c-line1{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.cause .c-n{font-size:13.5px;font-weight:600}
.cause .c-g{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:4px;padding:0 6px;line-height:17px}
.cause .c-v{margin-left:auto;font-size:16px}
.cause .c-fix{font-size:11.5px;color:var(--ink-3);margin-top:4px}
/* ── 用户与角色 ─────────────────────────────── */
.rolegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 20px 20px}
.rolecard{border:1px solid var(--line);border-radius:var(--r-s);padding:12px 16px;background:var(--panel);display:flex;flex-direction:column}
.rolecard .r-top{display:flex;align-items:center;gap:8px}
.rolecard .r-name{font-size:14px;font-weight:600}
.rolecard .r-cnt{margin-left:auto;font-size:12px;color:var(--ink-3)}
.rolecard .r-perm{font-size:11.5px;color:var(--brand);background:var(--brand-bg);border-radius:4px;padding:3px 8px;margin:8px 0 6px;line-height:1.5}
.rolecard .r-desc{font-size:12px;color:var(--ink-3);flex:1}
.rolecard .r-ops{margin-top:10px}
.switch{width:34px;height:19px;border-radius:10px;background:var(--line);position:relative;transition:background .15s;flex:none}
.switch i{position:absolute;left:2px;top:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.switch.on{background:var(--ok)}
.switch.on i{transform:translateX(15px)}
/* 附件大图查看 */
.lb{position:fixed;inset:0;background:rgba(10,16,24,.62);z-index:60;display:none;align-items:center;justify-content:center}
.lb.show{display:flex}
.lb-card{width:min(760px,88vw);background:var(--panel);border-radius:var(--r-m);box-shadow:var(--shadow-lg);overflow:hidden}
.lb-img{aspect-ratio:4/3;display:grid;place-items:center;color:var(--ink-3);background:linear-gradient(135deg,var(--panel-2),var(--brand-bg));cursor:zoom-in}
.lb-bar{display:flex;align-items:center;gap:12px;padding:12px 20px}
.lb-bar .n{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-bar .t{font-size:12px;color:var(--brand)}
/* ── 弹窗 / 提示 ────────────────────────────────── */
.mask{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:40;display:none;align-items:center;justify-content:center}
.mask.show{display:flex}
.modal{width:440px;background:var(--panel);border-radius:var(--r-m);box-shadow:var(--shadow-lg);padding:24px}
.modal h3{font-size:15px;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--ink-2);margin-bottom:16px}
.modal textarea{width:100%;min-height:88px;padding:10px 12px;resize:vertical;border:1px solid var(--line);border-radius:var(--r-s);background:var(--panel)}
.modal .hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.modal .ops{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;top:64px;left:50%;transform:translate(-50%,-12px);background:var(--ink);color:#fff;font-size:13px;padding:8px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;box-shadow:var(--shadow-lg)}
[data-theme=dark] .toast{background:#33404F}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:1180px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .kv{grid-template-columns:repeat(2,1fr)}
  .kv div:nth-child(2n){border-right:0}
  .atts{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .step::after{display:none}
  .chart-grid,.two-col,.llm-grid{grid-template-columns:1fr}
  .llm-uses{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ═══ 登录页 ═══ -->

        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
        系统管理员
      </button>
      <button class="role-pick" data-role="leader">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17l5-5 4 3 5-6 4 4"/><path d="M3 21h18"/></svg>
        领导查询
      </button>
    </div>
    <button class="btn primary login-btn" id="loginBtn">登 录</button>
    
  </div>
</div>

<!-- ═══ 主应用 ═══ -->
<div class="app hidden" id="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 15c2 0 3-1.4 5-1.4S10.6 15 12 15s3-1.4 5-1.4 2.6 1.4 4 1.4"/><path d="M3 19c2 0 3-1.4 5-1.4S10.6 19 12 19s3-1.4 5-1.4 2.6 1.4 4 1.4"/><path d="M12 4v8"/><path d="M8 8l4-4 4 4"/></svg>

        <svg id="iconMoon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"/></svg>
        <svg id="iconSun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="display:none"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>

<div class="mask" id="mask" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <h3 id="mTitle">退回报账人</h3>
    <div class="sub" id="mSub"></div>
    <textarea id="mReason" placeholder="退回原因（必填），填写缺少的材料或需修正的内容，将通知报账人修改后重新提交"></textarea>

/* ═══ 页面：AI 智能审核（重做：部署流水线式运行面板）═══ */
function renderAI(){
  const PHASES = [
    ['感知 · 取单据快照','S', S.aiStep>0?'0.2 s':'', S.aiStep===0],
    ['研判 · 28 条规则逐条判定','D', S.aiStep>1?'11.9 s':'', S.aiStep===1],
    ['落库 · 结论与证据','A', S.aiStep>2?'0.6 s':'', S.aiStep===2],
    ['模型补判 · 待人工项','F', S.aiStep>3?'5 m 30 s':'', S.aiStep===3],
  ];
  if(S.aiStep===undefined) S.aiStep = 4;
  const idle = !S.aiBusy && S.aiStep>=4;
  const resHtml = idle ? `
    <div class="res-row">
      <div class="res bad"><b>9</b>不通过</div>
      <div class="res warn"><b>14</b>待复核</div>
      <div class="res ok"><b>6</b>通过</div>
      <div class="res"><b>25</b>模型补判 · 全成功</div>
    </div>` : '';
  $('#view').innerHTML = `
    <div class="runpanel ${idle?'done':(S.aiStep===0?'idle':'')}">
      <div class="run-head">
        <span class="rt">${S.aiBusy?'<span class="spin" aria-hidden="true"></span>':''}${S.aiBusy?`正在审核 · ${S.aiSec}s`:idle?'上一轮 · 10-24 09:31 · 0.64 s/单':''}</span>
        <span class="pill ok" style="margin-left:4px">自动预审开启</span>
        <span style="font-size:12px;color:var(--ink-3)">新单自动进入审核，无需手动触发</span>
        <div class="grow"></div>
        ${S.aiBusy?'<button class="btn ghost" id="aiBg">转入后台</button>':`<button class="btn primary lg" id="aiRun">开始智能审核</button>`}
      </div>
      ${S.aiBusy?`<div class="runbar"><i style="width:${S.aiStep/4*100}%"></i></div>
      <ul class="runsteps">
        ${PHASES.map(([n,t,ms,run])=>`
        <li class="rs ${run?'run':ms?'done':''}">
          <span class="ic">${run?'':ms?'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg>':''}</span>
          ${n}<span class="t">${run?'进行中…':ms}</span>
        </li>`).join('')}
      </ul>`:resHtml}
    </div>
    ${idle?`
    <div class="card">
      <div class="card-head"><h2>结果明细</h2><div class="grow"></div>
        <button class="btn ghost" data-csv>导出结果</button>
        <button class="btn primary" data-go="bench">去工作台复核</button></div>
      <table class="tbl">
        <thead><tr><th>单据</th><th style="text-align:right">金额（元）</th><th>结论</th><th>命中</th><th>待人工</th><th></th></tr></thead>
        <tbody>${BILLS.filter(b=>b.demo).map(b=>{const[t,c]=CONCL[b.concl];return `<tr>
          <td>${b.no}</td><td class="amt num">${fmt(b.amt)}</td><td>${pill(t,c)}</td>
          <td class="num">${b.hit?`<b style="color:var(--bad)">${b.hit}</b>`:0}</td><td class="num">${b.pend||0}</td>
          <td><a href="#" data-go="bench">复核</a></td></tr>`}).join('')}</tbody>
      </table>
    </div>`:`
    <div class="card"><div style="padding:40px;text-align:center;color:var(--ink-3)">
      ${S.aiBusy?'':'尚未执行审核'}</div></div>`}`;
  const run = $('#aiRun'); if(run) run.onclick = startRun;
  const bg = $('#aiBg'); if(bg) bg.onclick = () => {toast('任务已转入后台执行，完成后通知；期间可浏览其他页面');};
  $('#view').querySelectorAll('[data-go]').forEach(a => a.onclick = e => {e.preventDefault(); go(a.dataset.go);});
}
function startRun(){
  S.aiBusy = true; S.aiSec = 0; S.aiStep = 0; renderAI();
  const iv = setInterval(()=>{S.aiSec++; if(S.view==='ai') renderAI();}, 1000);
  const steps = [
    [900, 1],   // S 完成 → D
    [2400, 2],  // D 完成 → A
    [3200, 3],  // A 完成 → 模型补判
    [5200, 4],  // 全部完成
  ];
  steps.forEach(([t, step]) => setTimeout(()=>{
    S.aiStep = step;
    if(step===4){
      clearInterval(iv); S.aiBusy = false;
      if(S.view==='ai') renderAI();
      toast('审核完成：不通过 9 · 待复核 14 · 通过 6');
    } else if(S.view==='ai') renderAI();
  }, t));
}

        <select class="select" id="fConcl" aria-label="结论筛选">${[['all','全部结论'],['pass','通过'],['review','待人工复核'],['reject','不通过']].map(([v,t])=>`<option value="${v}" ${S.concl===v?'selected':''}>${t}</option>`).join('')}</select>

  $('#view').querySelectorAll('[data-src]').forEach(b => b.onclick = () => {S.src = b.dataset.src; renderBench();});
  $('#view').querySelectorAll('[data-sort]').forEach(b => b.onclick = () => {S.sort = b.dataset.sort; renderBench();});
  $('#fConcl').onchange = e => {S.concl = e.target.value; renderBench();};
  let deb; const q = $('#fQ'); q.oninput = e => {clearTimeout(deb); deb = setTimeout(()=>{S.q = e.target.value.trim(); renderBench(); const nq=$('#fQ'); nq.focus(); nq.setSelectionRange(nq.value.length,nq.value.length);}, 250);};
  $('#view').querySelectorAll('[data-go]').forEach(a => a.onclick = e => {e.preventDefault(); go(a.dataset.go);});
  const syncBar = () => {const bar = $('#batchbar'); if(!bar) return; const n = S.sel.size; bar.classList.toggle('show', n>0); if($('#selCnt')) $('#selCnt').textContent = n;};
  $('#view').querySelectorAll('.rowcheck[data-no]').forEach(c => c.onchange = () => {c.checked ? S.sel.add(c.dataset.no) : S.sel.delete(c.dataset.no); syncBar();});

    ['L1','抽取链','规则草稿','生成规则草稿，标记待核实的数值','任务触发','2','1','8','46 s','草稿 94 份',true],
    ['L1','本体链','字段与枚举候选','从真实数据提取字段与枚举候选','任务触发','3','1','—','—','候选 36 条',false],
    ['L1','本体链','流程候选','从审批记录提取流程节点与迁移','任务触发','2','1','—','—','候选 20 条',false],
    ['L1','抽取链','规则明细成形','将表格类规则解析为明细行','任务触发','3','1','5','1.2 s','明细 125 行',true],
    ['L2','抽取链','抽取协同','归并多来源规则，标记口径冲突','任务触发','3','1','—','—','冲突 9 处',false],
    ['L2','本体链','本体对齐','执行规则与本体的双向一致性核对','任务触发','3','1','—','—','对账 41 组',false],
    ['L2','本体链','本体候选对齐','候选去重，输出三档判定建议','任务触发','2','1','—','—','判定 56 条',false],
  ];
  const CHAIN_C = {'审核链':'','抽取链':'k2','本体链':''};
  const running = N.filter(n=>n[10]).length;
  const node = (n) => `
    <button class="node${S.pickAgent===n[2]?' on':''}" data-n="${n[2]}">
      <div class="top"><span class="chain ${CHAIN_C[n[1]]}">${n[1]}</span><span class="dot ${n[10]?'run':'idle'}" title="${n[10]?'运行中':'待命'}"></span></div>
      <div class="nm">${n[2]}</div>
      <div class="ds">${n[3]}</div>
      <div class="io"><span>今日 <b>${n[7]}</b></span><span>产出 <b>${n[9].replace(/^\S+\s/,'')}</b></span></div>
    </button>`;
  const lane = (L) => N.filter(n=>n[0]===L).map(node).join('');

  $('#view').innerHTML = `
    <div class="stats" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat"><div class="k">运行中</div><div class="v num">${running}<small> / 13</small></div><div class="d">其余按需调度</div></div>

      <div class="stat"><div class="k">审核单均</div><div class="v num">0.39<small> s</small></div><div class="d">规则链路</div></div>
      <div class="stat"><div class="k">失败</div><div class="v num">0</div><div class="d">今日</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>运行拓扑</h2><div class="grow"></div>

        <div class="lane"><div class="lane-head"><span class="lt">感知层</span></div>

        <div class="flow"><span class="wire"></span><span class="sig">任务分发</span><span class="wire"></span></div>
        <div class="lane"><div class="lane-head"><span class="lt">执行层</span></div>
          <div class="lane-body">${lane('L1')}</div></div>
        <div class="flow"><span class="wire"></span><span class="sig">产出移交</span><span class="wire"></span></div>
        <div class="lane"><div class="lane-head"><span class="lt">协同层</span></div>
          <div class="lane-body">${lane('L2')}</div></div>
      </div>
    </div>

    e.stopPropagation();
    if(S.pickAgent===b.dataset.n){closePop(); return;}
    document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    S.pickAgent = b.dataset.n;
    showAgentPop(b, N.find(n=>n[2]===b.dataset.n));
  });
}
function closePop(){
  S.pickAgent = null;
  const p = $('#agentPop'); if(p) p.innerHTML='';
  document.querySelectorAll('.node').forEach(x=>x.classList.remove('on'));
}
function showAgentPop(anchor, n){
  $('#agentPop').innerHTML = `
    <div class="pop" id="thePop" role="dialog" aria-label="${n[2]}运行情况">
      <div class="p-head"><b>${n[2]}</b><span class="chain ${n[1]==='抽取链'?'k2':''}">${n[1]}</span>
        ${pill(n[10]?'运行中':'待命', n[10]?'ok':'brand')}
        <button class="x" aria-label="关闭" onclick="closePop()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button></div>
      <table class="tbl">
        <tbody>
          <tr><td>职责</td><td>${n[3]}</td></tr>
          <tr><td>触发机制</td><td>${n[4]}</td></tr>
          <tr><td>今日周期</td><td class="num">${n[7]}</td></tr>
          <tr><td>平均耗时</td><td class="num">${n[8]}</td></tr>
          <tr><td>累计产出</td><td>${n[9]}</td></tr>
        </tbody>
      </table>
      <div class="p-foot">读 ${n[5]} 张表 · 写 ${n[6]} 张表 · 写库仅限授权窗口</div>
    </div>`;
  const el = $('#thePop'), r = anchor.getBoundingClientRect();
  const W = 360, H = el.offsetHeight;
  let left = Math.min(Math.max(8, r.left + r.width/2 - W/2), innerWidth - W - 8);
  let top = r.bottom + 8;
  if(top + H > innerHeight - 8) top = Math.max(8, r.top - H - 8);
  el.style.left = left + 'px'; el.style.top = top + 'px';
}
document.addEventListener('click', e => {
  if(S.pickAgent && !e.target.closest('.pop') && !e.target.closest('.node')) closePop();
});

function pushHist(no, act, note){ (S.hist[no] = S.hist[no]||[]).unshift(['刚刚','林嘉',act, note||'—']); }
function openModal(sub){
  S.modalBill = sub;
  $('#mSub').textContent = sub; $('#mReason').value = '';
  $('#mOk').disabled = true; $('#mask').classList.add('show');
  setTimeout(()=>$('#mReason').focus(), 50);
}
$('#mReason').oninput = e => $('#mOk').disabled = !e.target.value.trim();
$('#mCancel').onclick = () => $('#mask').classList.remove('show');
$('#mOk').onclick = () => {
  if(S.modalBill && S.modalBill.startsWith('FJ')) pushHist(S.modalBill,'退回报账人', $('#mReason').value.trim());
  $('#mask').classList.remove('show'); S.sel.clear(); toast('已退回，理由已记录');
};
$('#mask').onclick = e => {if(e.target===e.currentTarget) $('#mask').classList.remove('show');};
$('#lbClose').onclick = () => $('#lb').classList.remove('show');
$('#lb').onclick = e => {if(e.target===e.currentTarget) $('#lb').classList.remove('show');};
document.addEventListener('keydown', e => {if(e.key==='Escape'){$('#mask').classList.remove('show'); $('#lb').classList.remove('show');}});

  if(!PAGES[view]) return;
  S.view = view;
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('on', b.dataset.view===view));
  $('#pageTitle').textContent = TITLES[view];
  PAGES[view]();
  $('#view').scrollTop = 0;
}

const saved = localStorage.getItem('fjhy-demo-theme');
if(saved) document.documentElement.dataset.theme = saved;
function syncThemeIcon(){
  const dark = document.documentElement.dataset.theme==='dark';
  $('#iconMoon').style.display = dark?'none':'';
  $('#iconSun').style.display = dark?'':'none';
}
$('#themeBtn').onclick = () => {
  const next = document.documentElement.dataset.theme==='dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('fjhy-demo-theme', next); syncThemeIcon();
};
syncThemeIcon();
</script>
</body>
</html>
